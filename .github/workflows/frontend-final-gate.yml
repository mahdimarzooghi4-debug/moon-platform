name: Frontend Final Gate

on:
  push:
    branches:
      - integration/frontend-final

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install clean dependencies
        run: npm ci

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Build production bundle
        run: npm run build

      - name: Frontend integration smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -f src/payment-result/receipt/index.tsx
          test -f src/payment-result/receipt/index.css
          test ! -e src/router/AppRouter.tsx
          grep -Fq 'import("../payment-result/receipt")' src/app/router.tsx
          grep -Fq 'path="/payment/result/receipt"' src/app/router.tsx
          grep -Fq 'https://static.codia.ai/image/2026-08-24/DtUrYC5R5Y.png' src/payment-result/receipt/index.tsx
          grep -Fq 'https://static.codia.ai/image/2026-08-24/N1jbnDfhdz.png' src/payment-result/receipt/index.tsx
          grep -Fq 'https://static.codia.ai/image/2026-08-24/JZcebh8eW2.png' src/payment-result/receipt/index.tsx
          grep -Fq 'https://static.codia.ai/image/2026-08-24/R2fSagPYyr.png' src/payment-result/receipt/index.tsx
          ! grep -Fq '/overlays/' src/app/router.tsx
          grep -Fq 'path="/panel/startup"' src/app/router.tsx
          grep -Fq 'path="/panel/company"' src/app/router.tsx
          grep -Fq 'path="/panel/admin"' src/app/router.tsx
          grep -Fq 'path="/panel/creative-house"' src/app/router.tsx
          grep -Fq 'path="/panel/fund-manager"' src/app/router.tsx
          grep -Fq 'path="/panel/emdad"' src/app/router.tsx
          python - <<'PY'
          from pathlib import Path
          import re
          router = Path('src/app/router.tsx').read_text()
          paths = re.findall(r'<Route\s+path="([^"]+)"', router)
          dupes = sorted({p for p in paths if paths.count(p) > 1})
          if dupes:
              raise SystemExit(f'duplicate routes: {dupes}')
          required = {
              '/payment/result/receipt',
              '/panel/startup',
              '/panel/company',
              '/panel/admin',
              '/panel/creative-house',
              '/panel/fund-manager',
              '/panel/emdad',
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f'missing required routes: {missing}')
          print(f'route smoke OK: {len(paths)} explicit routes, no duplicates')
          PY
