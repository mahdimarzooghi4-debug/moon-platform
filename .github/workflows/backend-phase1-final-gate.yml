name: Backend Phase 1 Final Gate

on:
  push:
    branches:
      - feat/backend-phase-1-project

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moon
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon-phase1-final-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Moon.Platform.slnx

      - name: Build with warnings as errors
        run: dotnet build Moon.Platform.slnx --no-restore --configuration Release -warnaserror

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Verify committed migrations match model
        run: dotnet ef migrations has-pending-model-changes --project src/Moon.Platform.Api/Moon.Platform.Api.csproj --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj

      - name: Run complete backend test suite on PostgreSQL 18
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-phase1-final-only
        run: dotnet test Moon.Platform.slnx --no-build --configuration Release

      - name: Verify Phase 1 closure controls
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/releases/phase-1-closure.md
          test -f tests/Moon.Platform.Tests/Phase1ProjectTests.cs
          test -f tests/Moon.Platform.Tests/Phase1EvaluationTests.cs
          test -f tests/Moon.Platform.Tests/Phase1PublishTests.cs
          grep -Fq 'Project_creation_requires_active_organization_membership' tests/Moon.Platform.Tests/Phase1ProjectTests.cs
          grep -Fq 'Project_versions_lock_and_submit_is_non_bypassable' tests/Moon.Platform.Tests/Phase1ProjectTests.cs
          grep -Fq 'decision_separation_of_duties' src/Moon.Platform.Api/Modules/Evaluations/EvaluationService.cs
          grep -Fq 'decision_evaluation_incomplete' src/Moon.Platform.Api/Modules/Evaluations/EvaluationService.cs
          grep -Fq 'project.published' src/Moon.Platform.Api/Modules/Projects/ProjectService.cs
          grep -Fq 'project_publish_approval_missing' src/Moon.Platform.Api/Modules/Projects/ProjectService.cs
          grep -Fq 'project_publish_evaluation_invalid' src/Moon.Platform.Api/Modules/Projects/ProjectService.cs
          grep -Fq 'GuardLockedProjectVersions' src/Moon.Platform.Api/Infrastructure/Persistence/MoonDbContext.cs
          grep -Fq 'GuardFinalEvaluations' src/Moon.Platform.Api/Infrastructure/Persistence/MoonDbContext.cs
          grep -Fq 'GuardDecisionsAppendOnly' src/Moon.Platform.Api/Infrastructure/Persistence/MoonDbContext.cs
          grep -Fq 'GuardPublishedProjects' src/Moon.Platform.Api/Infrastructure/Persistence/MoonDbContext.cs
          grep -Fq '/{projectId:guid}/submit' src/Moon.Platform.Api/Modules/Projects/ProjectEndpoints.cs
          grep -Fq '/{projectId:guid}/publish' src/Moon.Platform.Api/Modules/Projects/ProjectEndpoints.cs
          grep -Fq '/api/v1/evaluations/{evaluationId:guid}/decision' src/Moon.Platform.Api/Modules/Evaluations/EvaluationEndpoints.cs
          grep -R -Fq 'partial class Phase1Project' src/Moon.Platform.Api/Infrastructure/Persistence/Migrations
          grep -R -Fq 'partial class Phase1EvaluationDecision' src/Moon.Platform.Api/Infrastructure/Persistence/Migrations
          grep -R -Fq 'partial class Phase1Publish' src/Moon.Platform.Api/Infrastructure/Persistence/Migrations
