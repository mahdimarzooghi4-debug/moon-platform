name: Frontend Auth Gate

on:
  push:
    branches:
      - feat/frontend-auth-integration

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install clean dependencies
        run: npm ci

      - name: Verify dependency manifests unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Build production bundle
        run: npm run build

      - name: Auth integration smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -f src/auth/oidc.ts
          test -f src/auth/AuthGate.tsx
          grep -Fq 'code_challenge_method: "S256"' src/auth/oidc.ts
          grep -Fq '/protocol/openid-connect/token' src/auth/oidc.ts
          grep -Fq 'pathname.startsWith("/panel/")' src/auth/AuthGate.tsx
          grep -Fq 'system_admin' src/auth/oidc.ts
          grep -Fq 'product_owner' src/auth/oidc.ts
          grep -Fq 'finance' src/auth/oidc.ts
          grep -Fq 'supervisor' src/auth/oidc.ts
          grep -Fq 'beginLogin' src/page/index.tsx
          grep -Fq '<AuthGate>' src/App.tsx
