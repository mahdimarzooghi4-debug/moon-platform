name: Sync Contact Support Assets

on:
  push:
    branches: [feat/contact-support]
    paths:
      - .github/workflows/sync-contact-support-assets.yml

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contact-support
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download Codia assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/codia
          curl -fL 'https://static.codia.ai/image/2026-08-22/1ZM1xjK7yS.png' -o public/assets/codia/1ZM1xjK7yS.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/1cD1DZxvgn.png' -o public/assets/codia/1cD1DZxvgn.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/5xxFrHwTbn.png' -o public/assets/codia/5xxFrHwTbn.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/8JOAgRR3qW.png' -o public/assets/codia/8JOAgRR3qW.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/ATpaoo5yTz.png' -o public/assets/codia/ATpaoo5yTz.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/AqYBh3U1n5.png' -o public/assets/codia/AqYBh3U1n5.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/H6hkemACOy.png' -o public/assets/codia/H6hkemACOy.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/QnPsMFx1D4.png' -o public/assets/codia/QnPsMFx1D4.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/T8QnShg0C5.png' -o public/assets/codia/T8QnShg0C5.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/UZJvM5nBjC.png' -o public/assets/codia/UZJvM5nBjC.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/fJGqnb2WdG.png' -o public/assets/codia/fJGqnb2WdG.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/iXpzkuGWDe.png' -o public/assets/codia/iXpzkuGWDe.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/icfFwFNDN0.png' -o public/assets/codia/icfFwFNDN0.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/nrVRK8GNEX.png' -o public/assets/codia/nrVRK8GNEX.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/qXM2Y4gW3J.png' -o public/assets/codia/qXM2Y4gW3J.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/rDKcBRYkBm.png' -o public/assets/codia/rDKcBRYkBm.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/reyGKQcwht.png' -o public/assets/codia/reyGKQcwht.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/tbz8m7Giir.png' -o public/assets/codia/tbz8m7Giir.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/vBk9ZWTuhr.png' -o public/assets/codia/vBk9ZWTuhr.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/vEh4zaSfem.png' -o public/assets/codia/vEh4zaSfem.png
          curl -fL 'https://static.codia.ai/image/2026-08-22/vrBzZyrM0w.png' -o public/assets/codia/vrBzZyrM0w.png
      - name: Install and build
        shell: bash
        run: |
          set +e
          npm install >/tmp/install.log 2>&1
          install_code=$?
          if [ "$install_code" -eq 0 ]; then
            npm run build >/tmp/build.log 2>&1
            build_code=$?
          else
            build_code=99
          fi
          set -e
          {
            echo "install=$install_code"
            echo "build=$build_code"
            echo "asset_count=$(find public/assets/codia -type f | wc -l)"
            echo "remote_codia_refs=$(grep -R 'static.codia.ai' src index.html --exclude-dir=node_modules | wc -l)"
            if [ "$install_code" -ne 0 ]; then cat /tmp/install.log; fi
            if [ "$build_code" -ne 0 ] && [ -f /tmp/build.log ]; then cat /tmp/build.log; fi
          } > src/page/.build-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/codia package-lock.json src/page/.build-check.txt
          git commit -m "chore(contact): localize assets and verify build" || true
          git push origin HEAD:feat/contact-support
          test "$install_code" -eq 0
          test "$build_code" -eq 0
