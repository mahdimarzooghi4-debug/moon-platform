name: Moon SMS Candidate Registry Transfer
# One-time transport of the already-reviewed exact candidate, not a deployment.
# Never use pull_request_target or production credentials here.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/moon-sms-registry-transfer.yml'
permissions: {}
concurrency:
  group: moon-sms-registry-transfer-5ea2da92
  cancel-in-progress: false
jobs:
  publish-reviewed-candidate:
    if: github.repository == 'mahdimarzooghi4-debug/moon-platform' && github.event.pull_request.number == 323 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/keycloak-central-sms-login'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      RELEASE_SHA: 5ea2da92149797f020ab333380f6bf69c5d89b93
      SOURCE_RUN: '45837117649'
      SOURCE_ARTIFACT: '15127516847'
      SOURCE_DIGEST: 8b5c7739c0e9d819b038dcac21727762d401f5e5ff48b6fedcf4b6d3179fd9aa
      REGISTRY_PREFIX: ghcr.io/mahdimarzooghi4-debug/moon-platform
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ea2da92149797f020ab333380f6bf69c5d89b93
          persist-credentials: false
      - name: Verify source artifact identity and load exact reviewed images in disposable CI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          umask 077
          out="$RUNNER_TEMP/registry-transfer"
          mkdir -p "$out"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$out/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$out/artifact.json"
          python3 - "$out" <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          run = json.loads((p / "run.json").read_text())
          artifact = json.loads((p / "artifact.json").read_text())
          sha = os.environ["RELEASE_SHA"]
          assert run["id"] == int(os.environ["SOURCE_RUN"])
          assert run["head_sha"] == sha and run["conclusion"] == "success"
          assert run["name"] == "Moon SMS Release Bundle"
          assert artifact["id"] == int(os.environ["SOURCE_ARTIFACT"])
          assert artifact["name"] == "moon-sms-candidate-" + sha
          assert artifact["workflow_run"]["id"] == run["id"]
          assert artifact["workflow_run"]["head_sha"] == sha and artifact["expired"] is False
          assert artifact["digest"] == "sha256:" + os.environ["SOURCE_DIGEST"]
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$out/artifact.zip"
          echo "$SOURCE_DIGEST  $out/artifact.zip" | sha256sum -c -
          python3 - "$out" <<'PY'
          import os, pathlib, sys, zipfile
          p = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(p / "artifact.zip") as z:
              expected = {"manifest.json", "moon-sms-release-" + os.environ["RELEASE_SHA"] + ".tar.gz"}
              assert len(z.namelist()) == 2 and set(z.namelist()) == expected
              for name in expected:
                  assert not (p / name).exists()
                  z.extract(name, p)
          PY
          python3 deploy/production/sms-release-bundle.py verify \
            --release-sha "$RELEASE_SHA" \
            --archive "$out/moon-sms-release-$RELEASE_SHA.tar.gz" --manifest "$out/manifest.json"
          docker load -i "$out/moon-sms-release-$RELEASE_SHA.tar.gz"
          python3 - "$out/manifest.json" <<'PY'
          import json, subprocess, sys
          manifest = json.load(open(sys.argv[1]))
          for image in manifest["images"].values():
              actual = subprocess.check_output(["docker","image","inspect","--format","{{.Id}}",image["tag"]],text=True).strip()
              assert actual == image["id"], "Loaded image differs from reviewed candidate"
          PY
      - name: Publish pinned candidate images and verify registry manifest config IDs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/registry-transfer"
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 - "$out" <<'PY'
          import json, os, pathlib, re, subprocess, sys
          p = pathlib.Path(sys.argv[1])
          manifest = json.loads((p / "manifest.json").read_text())
          sha = os.environ["RELEASE_SHA"]
          evidence = {"version":1,"releaseSha":sha,"sourceRun":int(os.environ["SOURCE_RUN"]),
                      "sourceArtifact":int(os.environ["SOURCE_ARTIFACT"]),"sourceArchiveDigest":manifest["archiveSha256"],
                      "images":{}}
          def run(*args):
              return subprocess.check_output(args,text=True).strip()
          for service in ("api","web","keycloak"):
              image = manifest["images"][service]
              repository = os.environ["REGISTRY_PREFIX"] + "-" + service
              tag = repository + ":" + sha
              subprocess.run(["docker","tag",image["tag"],tag],check=True)
              result = run("docker","push",tag)
              print(result, flush=True)
              digests = re.findall(r"digest: (sha256:[a-f0-9]{64})",result)
              assert len(digests) == 1, "Cannot determine registry manifest digest"
              digest = digests[0]
              pinned = repository + "@" + digest
              remote = json.loads(run("docker","manifest","inspect",pinned))
              assert remote["config"]["digest"] == image["id"], "Remote config ID differs from reviewed image"
              evidence["images"][service] = {"ref":pinned,"id":image["id"],"localTag":image["tag"]}
          output = p / "registry-manifest.json"
          with output.open("x") as f:
              json.dump(evidence,f,indent=2,sort_keys=True)
              f.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("## Verified candidate registry references (no deployment)\n\n")
              summary.write("Release SHA: `"+sha+"`\n\n")
              for service,image in evidence["images"].items():
                  summary.write("- "+service+": `"+image["ref"]+"`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: moon-sms-registry-refs-5ea2da92
          path: ${{ runner.temp }}/registry-transfer/registry-manifest.json
          if-no-files-found: error
          retention-days: 7
