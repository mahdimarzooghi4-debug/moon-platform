name: Finalize Landing Frontend

on:
  push:
    branches: [feat/landing-page]
    paths:
      - .github/workflows/finalize-landing.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finalize-landing.yml
      - .tmp/landing/**
      - src/**
      - package.json
      - index.html

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/landing-page
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore canonical page source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/landing public/assets/codia
          cat .tmp/landing/source.*.b64 | base64 -d | gzip -d > src/landing/MahLandingPage.tsx
      - name: Localize Codia assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            curl -fsSL "https://static.codia.ai/image/2026-08-22/$f" -o "public/assets/codia/$f"
          done < .tmp/landing/assets.txt
      - name: Install and verify
        shell: bash
        run: |
          set +e
          npm install >/tmp/install.log 2>&1
          install_code=$?
          if [ "$install_code" -eq 0 ]; then
            npm run build >/tmp/build.log 2>&1
            build_code=$?
          else
            build_code=99
          fi
          set -e
          remote_refs=$(grep -R 'static.codia.ai' src index.html --exclude-dir=node_modules | wc -l || true)
          asset_count=$(find public/assets/codia -type f | wc -l)
          echo "install=$install_code"
          echo "build=$build_code"
          echo "asset_count=$asset_count"
          echo "expected_assets=28"
          echo "remote_codia_refs=$remote_refs"
          if [ "$install_code" -ne 0 ]; then cat /tmp/install.log; fi
          if [ "$build_code" -ne 0 ] && [ -f /tmp/build.log ]; then cat /tmp/build.log; fi
          test "$install_code" -eq 0
          test "$build_code" -eq 0
          test "$remote_refs" -eq 0
          test "$asset_count" -eq 28
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/landing/MahLandingPage.tsx public/assets/codia package-lock.json
          git commit -m "feat(landing): finalize page with local assets" || true
          git push origin HEAD:feat/landing-page
