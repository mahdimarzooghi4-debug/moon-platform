name: Moon SMS Login Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  otp-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test isolated OTP policy
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          javac -Xlint:all -Werror -d "$out" $(find backend/keycloak/sms-login/src/main -name '*.java') backend/keycloak/sms-login/src/test/java/ir/mah/identity/LoginOtpChallengeTest.java
          java -cp "$out" ir.mah.identity.LoginOtpChallengeTest
  postgres-otp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: otp_test
          POSTGRES_USER: otp_test
          POSTGRES_PASSWORD: ci-only-otp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otp_test -d otp_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      OTP_TEST_JDBC: jdbc:postgresql://localhost:5432/otp_test
      OTP_TEST_USER: otp_test
      OTP_TEST_PASSWORD: ci-only-otp
      PGPASSWORD: ci-only-otp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only PostgreSQL JDBC and CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libpostgresql-jdbc-java postgresql-client
      - name: Test real PostgreSQL atomic transitions and shared limits
        run: |
          set -euo pipefail
          psql -h localhost -U otp_test -d otp_test -v ON_ERROR_STOP=1 -f backend/keycloak/sms-login/schema.sql
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          javac -Xlint:all -Werror -cp /usr/share/java/postgresql.jar -d "$out" $(find backend/keycloak/sms-login/src -name '*.java')
          java -cp "$out:/usr/share/java/postgresql.jar" ir.mah.identity.PostgresLoginOtpStoreTest

  sms-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify SMS.ir protocol with a local HTTP server (no live SMS)
        run: |
          set -euo pipefail
          root=backend/keycloak/sms-login
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          mvn -B -q -f "$root/transport/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.9.0:build-classpath -Dmdep.outputFile="$out/classpath"
          cp=$(cat "$out/classpath")
          javac -Xlint:all -Werror -cp "$cp" -d "$out" $(find "$root/src/main" "$root/transport/src" -name '*.java')
          java -cp "$out:$cp" ir.mah.identity.SmsIrLoginSenderTest

  keycloak-provider-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile provider against Keycloak 26.7.3
        run: |
          set -euo pipefail
          root=backend/keycloak/sms-login
          mvn -B -q -f "$root/pom.xml" -Dmaven.test.skip=true package
          jar="$root/target/moon-sms-login-1.0.0.jar"
          jar tf "$jar" | grep -Fx 'META-INF/services/org.keycloak.authentication.AuthenticatorFactory'
          jar tf "$jar" | grep -Fx 'theme-resources/templates/moon-sms-login.ftl'
          jar tf "$jar" | grep -Fx 'ir/mah/identity/MoonSmsAuthenticator.class'
      - name: Verify provider installation on disposable exact-version Keycloak
        run: |
          set -euo pipefail
          jar="$PWD/backend/keycloak/sms-login/target/moon-sms-login-1.0.0.jar"
          chmod a+r "$jar"
          docker run --rm -v "$jar:/opt/keycloak/providers/moon-sms-login.jar:ro" quay.io/keycloak/keycloak:26.7.3 build --db=postgres

  frontend-oidc-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/moon-oidc-entry.test.mjs

  keycloak-browser-integration:
    # Playwright 1.51 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install disposable Chromium test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Run real Keycloak browser and PostgreSQL integration with isolated SMS HTTPS
        run: bash backend/keycloak/sms-login/integration/run.sh
