name: Verify Admin Panel domain core

on:
  push:
    branches:
      - feat/admin-panel

permissions:
  contents: write

concurrency:
  group: admin-domain-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="8fe4e03940d960d002d905e4e2c039f2edbe8306"
          SOURCE_TREE="4dd10a1f1c9bb11594ea7e5e3e33eaba59377175"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git hash-object src/features/admin-panel/organizations/index.tsx)" = "49083fea76c09ab3d6052ee6b0b1838226759302"
          test "$(git hash-object src/features/admin-panel/organization-detail/index.tsx)" = "1e84e0541dd76302aebae5a00a04187c103bfe59"
          test "$(git hash-object src/features/admin-panel/projects/index.tsx)" = "0afc2570906c5aa2e8cbe8f6c13f52e1b32a37d0"
          test "$(git hash-object src/features/admin-panel/project-detail/index.tsx)" = "2c4ea19e35b326a3d7d4b97ecbf38687f20a2e63"
          test "$(git hash-object src/features/admin-panel/funding/index.tsx)" = "34e96c06f25aaceadb5d911223fa56a469b259e0"
          test "$(git hash-object src/features/admin-panel/funding-detail/index.tsx)" = "ccc9b2ef75f373b0e0f72373dc25ad51e95b4a08"
          test "$(git hash-object src/features/admin-panel/list-flow.css)" = "21ac4e4175a2931e4dffb5665bdc1166e1c39ea8"
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify Figma asset isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'static\.codia\.ai|figma\.com/api/mcp/asset' src/features/admin-panel/organizations src/features/admin-panel/organization-detail src/features/admin-panel/projects src/features/admin-panel/project-detail src/features/admin-panel/funding src/features/admin-panel/funding-detail src/features/admin-panel/list-flow.css
          test "$(git hash-object public/assets/admin-panel/users-active.svg)" = "581ba13aefad98e52fa806402b7bb5f6772e7342"
          test "$(git hash-object public/assets/admin-panel/users-roles.svg)" = "d98703cdce90c027619900238402742fffa815c9"
          test "$(git hash-object public/assets/admin-panel/users-review.svg)" = "6118adb6afddbafe91800dee1682936a435dc14c"
          test "$(git hash-object public/assets/admin-panel/users-blocked.svg)" = "05990c35f1f50ca1d32de13a28de775485e0a474"

      - name: Patch domain routes idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/router.tsx')
          s = p.read_text()
          import_anchor = 'const AdminUserDetailPage = lazy(() => import("../features/admin-panel/user-detail"));\n'
          imports = '''const AdminOrganizationsPage = lazy(() => import("../features/admin-panel/organizations"));
          const AdminOrganizationDetailPage = lazy(() => import("../features/admin-panel/organization-detail"));
          const AdminProjectsPage = lazy(() => import("../features/admin-panel/projects"));
          const AdminProjectDetailPage = lazy(() => import("../features/admin-panel/project-detail"));
          const AdminFundingPage = lazy(() => import("../features/admin-panel/funding"));
          const AdminFundingDetailPage = lazy(() => import("../features/admin-panel/funding-detail"));
          '''
          if 'const AdminOrganizationsPage =' not in s:
              s = s.replace(import_anchor, import_anchor + imports)
          element_anchor = 'const adminUserDetailElement = lazyElement(AdminUserDetailPage);\n'
          elements = '''const adminOrganizationsElement = lazyElement(AdminOrganizationsPage);
          const adminOrganizationDetailElement = lazyElement(AdminOrganizationDetailPage);
          const adminProjectsElement = lazyElement(AdminProjectsPage);
          const adminProjectDetailElement = lazyElement(AdminProjectDetailPage);
          const adminFundingElement = lazyElement(AdminFundingPage);
          const adminFundingDetailElement = lazyElement(AdminFundingDetailPage);
          '''
          if 'const adminOrganizationsElement =' not in s:
              s = s.replace(element_anchor, element_anchor + elements)
          route_anchor = '        <Route path="/panel/admin/users" element={adminUsersRolesElement} />\n'
          routes = '''        <Route path="/panel/admin/organizations/:organizationId" element={adminOrganizationDetailElement} />
                  <Route path="/panel/admin/organizations" element={adminOrganizationsElement} />
                  <Route path="/panel/admin/projects/:projectId" element={adminProjectDetailElement} />
                  <Route path="/panel/admin/projects" element={adminProjectsElement} />
                  <Route path="/panel/admin/funding/:fundingId" element={adminFundingDetailElement} />
                  <Route path="/panel/admin/funding" element={adminFundingElement} />
          '''
          if '<Route path="/panel/admin/organizations"' not in s:
              s = s.replace(route_anchor, route_anchor + routes)
          p.write_text(s)
          PY

      - name: Verify routes and prototype transitions
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'const AdminOrganizationsPage = lazy' src/app/router.tsx)" -eq 1
          test "$(grep -c 'const AdminOrganizationDetailPage = lazy' src/app/router.tsx)" -eq 1
          test "$(grep -c 'const AdminProjectsPage = lazy' src/app/router.tsx)" -eq 1
          test "$(grep -c 'const AdminProjectDetailPage = lazy' src/app/router.tsx)" -eq 1
          test "$(grep -c 'const AdminFundingPage = lazy' src/app/router.tsx)" -eq 1
          test "$(grep -c 'const AdminFundingDetailPage = lazy' src/app/router.tsx)" -eq 1
          for route in "/panel/admin/organizations" "/panel/admin/projects" "/panel/admin/funding"; do
            grep -Fq "path=\"$route\"" src/app/router.tsx
          done
          grep -Fq 'path="/panel/admin/organizations/:organizationId"' src/app/router.tsx
          grep -Fq 'path="/panel/admin/projects/:projectId"' src/app/router.tsx
          grep -Fq 'path="/panel/admin/funding/:fundingId"' src/app/router.tsx
          grep -Fq 'to="/panel/admin/projects/sample"' src/features/admin-panel/organization-detail/index.tsx
          grep -Fq 'to="/panel/admin/funding/sample"' src/features/admin-panel/project-detail/index.tsx
          grep -Fq 'to="/panel/admin/projects/sample"' src/features/admin-panel/funding-detail/index.tsx
          ! grep -R -E '2411:(61|64|67|73)' src/features/admin-panel/organizations src/features/admin-panel/organization-detail src/features/admin-panel/projects src/features/admin-panel/project-detail src/features/admin-panel/funding src/features/admin-panel/funding-detail

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"
          git diff --exit-code -- package-lock.json

      - name: Commit clean product batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx
          git rm .github/workflows/gate-admin-domain-core.yml
          git commit -m "feat(admin-panel): route organizations projects and funding"
          git push
