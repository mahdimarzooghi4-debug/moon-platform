name: Verify Admin Panel reports

on:
  push:
    branches:
      - feat/admin-panel

permissions:
  contents: write

concurrency:
  group: admin-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="038b6b831f5e5c0f12ad6624cf1f93a00d2cbbc5"
          SOURCE_TREE="7c1b92be944f88d8a7972c976bf70b23a25d7021"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git hash-object src/features/admin-panel/reports/index.tsx)" = "45c273f761e13d32293c096da9d23aafb033a8a4"
          test "$(git hash-object src/features/admin-panel/report-detail/index.tsx)" = "e37becc8b13f51f53aea34904cdc4b186a0c3828"
          test "$(git hash-object src/features/admin-panel/list-flow.css)" = "0fc4257bc9f1a0cb319e0cc94eb2a2a1edfaa902"
          test "$(git hash-object src/app/router.tsx)" = "2ee017dc6192da3f080880c30a3581150c185b6d"
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify asset isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'static\.codia\.ai|figma\.com/api/mcp/asset' src/features/admin-panel/reports src/features/admin-panel/report-detail
          test "$(git hash-object public/assets/admin-panel/users-active.svg)" = "581ba13aefad98e52fa806402b7bb5f6772e7342"
          test "$(git hash-object public/assets/admin-panel/users-roles.svg)" = "d98703cdce90c027619900238402742fffa815c9"
          test "$(git hash-object public/assets/admin-panel/users-review.svg)" = "6118adb6afddbafe91800dee1682936a435dc14c"
          test "$(git hash-object public/assets/admin-panel/users-blocked.svg)" = "05990c35f1f50ca1d32de13a28de775485e0a474"

      - name: Patch report routes idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/router.tsx')
          s = p.read_text()
          ia = 'const AdminRevenueDetailPage = lazy(() => import("../features/admin-panel/revenue-detail"));\n'
          imports = '''const AdminReportsPage = lazy(() => import("../features/admin-panel/reports"));
          const AdminReportDetailPage = lazy(() => import("../features/admin-panel/report-detail"));
          '''
          if 'const AdminReportsPage =' not in s:
              s = s.replace(ia, ia + imports)
          ea = 'const adminRevenueDetailElement = lazyElement(AdminRevenueDetailPage);\n'
          elements = '''const adminReportsElement = lazyElement(AdminReportsPage);
          const adminReportDetailElement = lazyElement(AdminReportDetailPage);
          '''
          if 'const adminReportsElement =' not in s:
              s = s.replace(ea, ea + elements)
          ra = '        <Route path="/panel/admin/revenues" element={adminRevenuesElement} />\n'
          routes = '''        <Route path="/panel/admin/reports/:reportId" element={adminReportDetailElement} />
                  <Route path="/panel/admin/reports" element={adminReportsElement} />
          '''
          if '<Route path="/panel/admin/reports"' not in s:
              s = s.replace(ra, ra + routes)
          p.write_text(s)
          PY

      - name: Verify report routes and transitions
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'const AdminReportsPage = lazy' src/app/router.tsx)" -eq 1
          test "$(grep -c 'const AdminReportDetailPage = lazy' src/app/router.tsx)" -eq 1
          grep -Fq 'path="/panel/admin/reports/:reportId"' src/app/router.tsx
          grep -Fq 'path="/panel/admin/reports"' src/app/router.tsx
          grep -Fq 'to="/panel/admin/projects"' src/features/admin-panel/report-detail/index.tsx
          grep -Fq 'to="/panel/admin/reports"' src/features/admin-panel/report-detail/index.tsx
          ! grep -R -E '2411:(61|64|67|73)' src/features/admin-panel/reports src/features/admin-panel/report-detail

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"
          git diff --exit-code -- package-lock.json

      - name: Commit clean product batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx
          git rm .github/workflows/gate-admin-reports.yml
          git commit -m "feat(admin-panel): route reports"
          git push
