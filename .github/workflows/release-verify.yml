name: Release Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  production-deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose config WITHOUT deploying
        run: docker compose --env-file deploy/production/env.example -f deploy/production/compose.yaml config --quiet
      - name: Validate private operator scripts and production Keycloak realm
        run: |
          bash -n deploy/production/preflight.sh
          bash -n deploy/production/backup-databases.sh
          python3 -m json.tool backend/keycloak/moon-realm-production.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          realm = json.loads(Path("backend/keycloak/moon-realm-production.json").read_text())
          assert realm["realm"] == "moon" and not realm["registrationAllowed"]
          web = next(c for c in realm["clients"] if c["clientId"] == "moon-web")
          assert web["redirectUris"] == ["https://mahcsr.ir/auth/callback"]
          assert web["webOrigins"] == ["https://mahcsr.ir"]
          config = Path("deploy/production/Caddyfile").read_text()
          assert "reverse_proxy api:8080" in config
          assert "reverse_proxy keycloak:8080" in config
          assert "access_log" not in config and "log {" not in config
          # Server-verified registry sources. Never silently switch back to
          # Docker Hub, which returned 403 from the Ubuntu host.
          compose = Path("deploy/production/compose.yaml").read_text()
          dockerfile = Path("Dockerfile").read_text()
          for name in ("postgres:18-alpine", "caddy:2.10.2-alpine"):
              assert "public.ecr.aws/docker/library/" + name in compose
          assert "image: postgres:" not in compose and "image: caddy:" not in compose
          assert "FROM public.ecr.aws/docker/library/node:22-alpine AS build" in dockerfile
          assert "FROM public.ecr.aws/nginx/nginx-unprivileged:stable-alpine AS runtime" in dockerfile

          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:auth
      - run: npm run build
        env:
          # Vite bundles the full Moon web; the default Node heap (about 2 GiB)
          # exhausted in Release Verify #89 despite successful dependency install.
          NODE_OPTIONS: --max-old-space-size=5120

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moon
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: moon
          RABBITMQ_DEFAULT_PASS: moon-ci-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-ci-only
      TEST_RABBITMQ_HOST: localhost
      TEST_RABBITMQ_USER: moon
      TEST_RABBITMQ_PASSWORD: moon-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install --global dotnet-ef --version 10.0.12
      - working-directory: backend
        run: dotnet restore Moon.Platform.slnx
      - working-directory: backend
        run: dotnet build Moon.Platform.slnx -c Release --no-restore -warnaserror
      - working-directory: backend
        run: dotnet ef migrations has-pending-model-changes --project src/Moon.Platform.Api/Moon.Platform.Api.csproj --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj
      - working-directory: backend
        run: dotnet test Moon.Platform.slnx -c Release --no-build --no-restore --logger "console;verbosity=normal"
