name: Backend Phase 3 Execution Controls Gate

# Temporary verification workflow; remove after the full controls gate is GREEN.
on:
  push:
    branches:
      - feat/backend-phase-3-execution

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moon
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-local-only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/backend-phase-3-execution

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Moon.Platform.slnx

      - name: Build warnings as errors
        run: dotnet build Moon.Platform.slnx -c Release --no-restore -warnaserror

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Generate Phase 3 controls migration with EF Core
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -R --quiet 'partial class Phase3ExecutionControls' src/Moon.Platform.Api/Infrastructure/Persistence/Migrations; then
            dotnet ef migrations add Phase3ExecutionControls \
              --project src/Moon.Platform.Api/Moon.Platform.Api.csproj \
              --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/Moon.Platform.Api/Infrastructure/Persistence/Migrations
            git commit -m "db(execution): add phase 3 controls migration"
            git push origin HEAD:feat/backend-phase-3-execution
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after generated migration
        if: steps.migration.outputs.generated == 'true'
        run: echo "Migration generated by EF Core; follow-up push will execute the full gate."

      - name: Verify no pending model changes
        if: steps.migration.outputs.generated == 'false'
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Moon.Platform.Api/Moon.Platform.Api.csproj
          --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj

      - name: Run full PostgreSQL 18 test suite
        if: steps.migration.outputs.generated == 'false'
        run: dotnet test Moon.Platform.slnx -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Phase 3 controls smoke checks
        if: steps.migration.outputs.generated == 'false'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ExecutionPolicies.ExpenseReviewer' src/Moon.Platform.Api/Program.cs
          grep -q 'ExecutionPolicies.RiskManager' src/Moon.Platform.Api/Program.cs
          grep -q 'ExecutionPolicies.FreezeManager' src/Moon.Platform.Api/Program.cs
          grep -q 'ExecutionPolicies.Disburser' src/Moon.Platform.Api/Program.cs
          grep -q 'MapExecutionControlEndpoints' src/Moon.Platform.Api/Program.cs
          grep -q 'DisabledPaymentGateway' src/Moon.Platform.Api/Program.cs
          grep -q 'ExecutionDisbursementReleased' src/Moon.Platform.Api/Common/Messaging/OutboxModels.cs
