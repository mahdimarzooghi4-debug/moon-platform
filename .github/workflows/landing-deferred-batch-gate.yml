name: Landing Deferred Batch Gate

on:
  push:
    branches:
      - integration/frontend-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-deferred-batch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install clean dependencies
        run: npm ci

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Verify deferred sources, Codia assets, and routes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/search-results/states/empty/index.tsx
            src/registration-track/index.tsx
            src/registration-track/states/approved/index.tsx
            src/registration-track/states/not-found/index.tsx
            src/registration-track/states/error/index.tsx
            src/impact-reports-list/states/error/index.tsx
          )
          for file in "${files[@]}"; do
            test -f "$file"
            grep -q 'https://static.codia.ai/' "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const router = fs.readFileSync('src/app/router.tsx', 'utf8');
          const required = [
            '/search/states/empty',
            '/registration/track',
            '/registration/track/states/approved',
            '/registration/track/states/not-found',
            '/registration/track/states/error',
            '/impact-reports/states/error'
          ];
          for (const path of required) {
            if (!router.includes(`path="${path}"`)) {
              console.error(`Missing route: ${path}`);
              process.exit(1);
            }
          }
          const paths = [...router.matchAll(/<Route\s+path="([^"]+)"/g)].map((m) => m[1]);
          const duplicates = [...new Set(paths.filter((p, i) => paths.indexOf(p) !== i))];
          if (duplicates.length) {
            console.error(`Duplicate exact route path(s): ${duplicates.join(', ')}`);
            process.exit(1);
          }
          console.log(`Deferred route smoke OK; ${paths.length} exact routes, no duplicates.`);
          NODE

      - name: Build frontend
        run: npm run build
