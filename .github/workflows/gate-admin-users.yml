name: Verify Admin Panel users flow

on:
  push:
    branches:
      - feat/admin-panel

permissions:
  contents: write

concurrency:
  group: admin-users-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "380bce23d9d2e0ea9c1699ab16a9469fb89d809f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/gate-admin-users.yml"
          test "$(git rev-parse HEAD^:src/features/admin-panel/users/index.tsx)" = "4732df310b65378011f4ae89863ef2385cb89793"
          test "$(git rev-parse HEAD^:src/features/admin-panel/users-new/index.tsx)" = "a5652f3f6cfe80b1c8fe8e257ba3b48848f29fcb"
          test "$(git rev-parse HEAD^:src/features/admin-panel/roles/index.tsx)" = "b61f57c45241d3e9e2b9ccbf75e7d5e4fbcc0d97"
          test "$(git rev-parse HEAD^:src/features/admin-panel/user-detail/index.tsx)" = "de6d7c7454b557f7a63e1db09e053e206453de55"
          test "$(git rev-parse HEAD^:src/features/admin-panel/users-flow.css)" = "0d3c79c1cf256c316bc73a54e6a912c7162ca33b"
          test "$(git rev-parse HEAD^:src/features/admin-panel/users-new/index.css)" = "17e76dbc3e25d7d1ca9f19ad0e5396f444c21ea6"
          test "$(git rev-parse HEAD^:package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify users flow assets
        run: |
          set -eu
          test "$(git rev-parse HEAD^:public/assets/admin-panel/users-active.svg)" = "581ba13aefad98e52fa806402b7bb5f6772e7342"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/users-roles.svg)" = "d98703cdce90c027619900238402742fffa815c9"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/users-review.svg)" = "6118adb6afddbafe91800dee1682936a435dc14c"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/users-blocked.svg)" = "05990c35f1f50ca1d32de13a28de775485e0a474"
          test "$(find public/assets/admin-panel -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 17
          if grep -R -n -E 'figma\.com/api/mcp/asset|static\.codia\.ai|localhost:[0-9]+' src/features/admin-panel public/assets/admin-panel; then
            echo "Remote or temporary asset reference found"
            exit 1
          fi

      - name: Patch users routes idempotently
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/router.tsx')
          t=p.read_text()
          imports=[
            'const AdminUsersRolesPage = lazy(() => import("../features/admin-panel/users"));\n',
            'const AdminAddUserPage = lazy(() => import("../features/admin-panel/users-new"));\n',
            'const AdminRoleManagementPage = lazy(() => import("../features/admin-panel/roles"));\n',
            'const AdminUserDetailPage = lazy(() => import("../features/admin-panel/user-detail"));\n',
          ]
          anchor='function lazyElement(Page: React.LazyExoticComponent<React.ComponentType>) {'
          assert t.count(anchor)==1
          missing=''.join(x for x in imports if x not in t)
          if missing: t=t.replace(anchor, missing+'\n'+anchor,1)
          elements=[
            'const adminUsersRolesElement = lazyElement(AdminUsersRolesPage);\n',
            'const adminAddUserElement = lazyElement(AdminAddUserPage);\n',
            'const adminRoleManagementElement = lazyElement(AdminRoleManagementPage);\n',
            'const adminUserDetailElement = lazyElement(AdminUserDetailPage);\n',
          ]
          anchor='/**\n * Routes are introduced around the existing Figma-derived screens'
          assert t.count(anchor)==1
          missing=''.join(x for x in elements if x not in t)
          if missing: t=t.replace(anchor, missing+'\n'+anchor,1)
          dashboard='        <Route path="/panel/admin" element={adminPanelDashboardElement} />\n'
          assert t.count(dashboard)==1
          routes=[
            '        <Route path="/panel/admin/users/new" element={adminAddUserElement} />\n',
            '        <Route path="/panel/admin/roles" element={adminRoleManagementElement} />\n',
            '        <Route path="/panel/admin/users/:userId" element={adminUserDetailElement} />\n',
            '        <Route path="/panel/admin/users" element={adminUsersRolesElement} />\n',
          ]
          missing=''.join(x for x in routes if x not in t)
          if missing: t=t.replace(dashboard,dashboard+missing,1)
          p.write_text(t)
          PY
          for needle in \
            'const AdminUsersRolesPage = lazy(() => import("../features/admin-panel/users"));' \
            'const AdminAddUserPage = lazy(() => import("../features/admin-panel/users-new"));' \
            'const AdminRoleManagementPage = lazy(() => import("../features/admin-panel/roles"));' \
            'const AdminUserDetailPage = lazy(() => import("../features/admin-panel/user-detail"));' \
            'const adminUsersRolesElement = lazyElement(AdminUsersRolesPage);' \
            'const adminAddUserElement = lazyElement(AdminAddUserPage);' \
            'const adminRoleManagementElement = lazyElement(AdminRoleManagementPage);' \
            'const adminUserDetailElement = lazyElement(AdminUserDetailPage);' \
            '<Route path="/panel/admin/users/new" element={adminAddUserElement} />' \
            '<Route path="/panel/admin/roles" element={adminRoleManagementElement} />' \
            '<Route path="/panel/admin/users/:userId" element={adminUserDetailElement} />' \
            '<Route path="/panel/admin/users" element={adminUsersRolesElement} />'; do
            test "$(grep -F -c "$needle" src/app/router.tsx)" -eq 1
          done

      - name: Verify users prototype transitions
        run: |
          set -eu
          test "$(grep -F -c 'to="/panel/admin/roles"' src/features/admin-panel/users/index.tsx)" -eq 1
          test "$(grep -F -c 'to="/panel/admin/users/new"' src/features/admin-panel/users/index.tsx)" -eq 1
          test "$(grep -F -c 'to={`/panel/admin/users/${user.id}`}' src/features/admin-panel/users/index.tsx)" -eq 1
          test "$(grep -F -c 'navigate("/panel/admin/users")' src/features/admin-panel/users-new/index.tsx)" -eq 1
          test "$(grep -F -c 'to="/panel/admin/users"' src/features/admin-panel/roles/index.tsx)" -eq 2
          test "$(grep -F -c 'to="/panel/admin/users"' src/features/admin-panel/user-detail/index.tsx)" -eq 1
          ! grep -R -n -E '2411:61|2411:67|2411:73' src/features/admin-panel/users src/features/admin-panel/users-new src/features/admin-panel/roles src/features/admin-panel/user-detail

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --quiet -- package-lock.json

      - name: Commit clean product batch
        run: |
          set -eu
          test "$(git diff --name-only)" = "src/app/router.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gate-admin-users.yml
          git add src/app/router.tsx
          git commit -m "feat(admin-panel): route users and roles flow"
          git push
