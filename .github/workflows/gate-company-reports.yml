name: Verify Company Panel reports flow

on:
  push:
    branches: [feat/company-panel]
    paths: [.github/workflows/gate-company-reports.yml]

permissions:
  contents: write

jobs:
  verify-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify pinned source tree and hashes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=0198dd59f1e9d67bcaf0449fb90e6deb315ed2f1
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git rev-parse "$SOURCE^{tree}")" = "2d77e6098e659e3cbb7d63eecdab44bdff1af891"
          test "$(git rev-parse "$SOURCE:src/features/company-panel/reports/index.tsx")" = "67a617714caf30a36891e897e7c00b9b7a12a810"
          test "$(git rev-parse "$SOURCE:src/features/company-panel/reports/index.css")" = "7a671a8f7583839327d0de6b30af1c6d697edf7b"
          test "$(git rev-parse "$SOURCE:src/features/company-panel/report-detail/index.tsx")" = "a60ad4c707d8c670f3dc0d8c775917807ad7bc47"
          test "$(git rev-parse "$SOURCE:src/features/company-panel/report-detail/index.css")" = "c38cc3e64f586ea0830afca366e22c52cf566acf"
          test "$(git rev-parse "$SOURCE:src/app/router.tsx")" = "03ed1ccc2a4e9d0e5f6e38ac035989527b83a137"
          test "$(git rev-parse "$SOURCE:package-lock.json")" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"
          test "$(git rev-parse "$SOURCE:.github/workflows/verify-frontend-integration.yml")" = "39906066a9546d895c4334a96607648b31593474"
      - name: Verify report source locality
        run: |
          set -euo pipefail
          ! grep -R -E 'figma.com/api/mcp/asset|static.codia.ai' src/features/company-panel/reports src/features/company-panel/report-detail
      - name: Apply idempotent Company report routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/router.tsx'); s=p.read_text()
          a='const CompanyParticipationDetailPage = lazy(() => import("../features/company-panel/participation-detail"));'
          if 'const CompanyReportsPage' not in s:
              assert a in s
              s=s.replace(a,a+'\nconst CompanyReportsPage = lazy(() => import("../features/company-panel/reports"));\nconst CompanyReportDetailPage = lazy(() => import("../features/company-panel/report-detail"));',1)
          a='const companyParticipationDetailElement = lazyElement(CompanyParticipationDetailPage);'
          if 'const companyReportsElement' not in s:
              assert a in s
              s=s.replace(a,a+'\nconst companyReportsElement = lazyElement(CompanyReportsPage);\nconst companyReportDetailElement = lazyElement(CompanyReportDetailPage);',1)
          a='        <Route path="/panel/company/participations/:participationId" element={companyParticipationDetailElement} />'
          if '/panel/company/reports/:reportId' not in s:
              assert a in s
              s=s.replace(a,a+'\n        <Route path="/panel/company/reports" element={companyReportsElement} />\n        <Route path="/panel/company/reports/:reportId" element={companyReportDetailElement} />',1)
          p.write_text(s)
          PY
          test "$(grep -c 'CompanyReportsPage' src/app/router.tsx)" -eq 2
          test "$(grep -c 'CompanyReportDetailPage' src/app/router.tsx)" -eq 2
          test "$(grep -c 'path="/panel/company/reports"' src/app/router.tsx)" -eq 1
          test "$(grep -c 'path="/panel/company/reports/:reportId"' src/app/router.tsx)" -eq 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify lockfile and baseline workflow unchanged
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"
          test "$(git hash-object .github/workflows/verify-frontend-integration.yml)" = "39906066a9546d895c4334a96607648b31593474"
      - name: Commit clean Router integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gate-company-reports.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx
          test "$(git diff --cached --name-only | sort | tr '\n' '|')" = ".github/workflows/gate-company-reports.yml|src/app/router.tsx|"
          git commit -m "feat(company-panel): route reports flow"
          git push origin HEAD:feat/company-panel
