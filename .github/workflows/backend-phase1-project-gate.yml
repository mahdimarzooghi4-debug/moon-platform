name: Backend Phase 1 Project Gate

on:
  push:
    branches:
      - feat/backend-phase-1-project

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moon
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon-phase1-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Moon.Platform.slnx

      - name: Build with warnings as errors
        run: dotnet build Moon.Platform.slnx --no-restore --configuration Release -warnaserror

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Generate Phase 1 migration when absent
        id: migration
        shell: bash
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-phase1-only
        run: |
          set -euo pipefail
          if grep -R -Fq 'partial class Phase1Project' src/Moon.Platform.Api/Infrastructure/Persistence/Migrations; then
            echo 'generated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dotnet ef migrations add Phase1Project \
            --project src/Moon.Platform.Api/Moon.Platform.Api.csproj \
            --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj
          echo 'generated=true' >> "$GITHUB_OUTPUT"

      - name: Commit generated migration
        if: steps.migration.outputs.generated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Moon.Platform.Api/Infrastructure/Persistence/Migrations
          git commit -m 'chore(project): add generated phase1 migration'
          git push origin HEAD:feat/backend-phase-1-project

      - name: Stop after migration commit
        if: steps.migration.outputs.generated == 'true'
        run: echo 'Migration committed; the push-triggered run will execute the full gate.'

      - name: Verify committed migrations match model
        if: steps.migration.outputs.generated != 'true'
        run: dotnet ef migrations has-pending-model-changes --project src/Moon.Platform.Api/Moon.Platform.Api.csproj --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj

      - name: Test project workflow against PostgreSQL 18
        if: steps.migration.outputs.generated != 'true'
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-phase1-only
        run: dotnet test Moon.Platform.slnx --no-build --configuration Release

      - name: Project module smoke checks
        if: steps.migration.outputs.generated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f src/Moon.Platform.Api/Modules/Projects/ProjectModels.cs
          test -f src/Moon.Platform.Api/Modules/Projects/ProjectService.cs
          test -f src/Moon.Platform.Api/Modules/Projects/ProjectEndpoints.cs
          grep -Fq 'MapProjectEndpoints' src/Moon.Platform.Api/Program.cs
          grep -Fq 'project.created' src/Moon.Platform.Api/Modules/Projects/ProjectService.cs
          grep -Fq 'project.version.created' src/Moon.Platform.Api/Modules/Projects/ProjectService.cs
          grep -Fq 'project.submitted' src/Moon.Platform.Api/Modules/Projects/ProjectService.cs
          grep -Fq '/{projectId:guid}/submit' src/Moon.Platform.Api/Modules/Projects/ProjectEndpoints.cs
          grep -Fq 'GuardLockedProjectVersions' src/Moon.Platform.Api/Infrastructure/Persistence/MoonDbContext.cs
