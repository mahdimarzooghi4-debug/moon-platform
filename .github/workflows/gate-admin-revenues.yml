name: Verify Admin Panel revenues

on:
  push:
    branches:
      - feat/admin-panel

permissions:
  contents: write

concurrency:
  group: admin-revenues-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="c8ec9020860120b417e239c87f8ce307c26ca6d0"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "dc3e4c57fc226b9b82234418f3c6d07b8fd325cf"
          test "$(git hash-object src/features/admin-panel/revenues/index.tsx)" = "1774e5e4628019ccd8d425af157328674b0ffe30"
          test "$(git hash-object src/features/admin-panel/revenue-detail/index.tsx)" = "fa07fd46456fa3e1096fbbfc5e3b22931e93efae"
          test "$(git hash-object src/features/admin-panel/list-flow.css)" = "0fc4257bc9f1a0cb319e0cc94eb2a2a1edfaa902"
          test "$(git hash-object src/app/router.tsx)" = "b4fbf362b1cd905a1de726c1788133e69d6e9ce6"
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify asset isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'static\.codia\.ai|figma\.com/api/mcp/asset' src/features/admin-panel/revenues src/features/admin-panel/revenue-detail src/features/admin-panel/list-flow.css
          test "$(git hash-object public/assets/admin-panel/users-active.svg)" = "581ba13aefad98e52fa806402b7bb5f6772e7342"
          test "$(git hash-object public/assets/admin-panel/users-roles.svg)" = "d98703cdce90c027619900238402742fffa815c9"
          test "$(git hash-object public/assets/admin-panel/users-review.svg)" = "6118adb6afddbafe91800dee1682936a435dc14c"
          test "$(git hash-object public/assets/admin-panel/users-blocked.svg)" = "05990c35f1f50ca1d32de13a28de775485e0a474"

      - name: Patch revenue routes idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/router.tsx')
          s = p.read_text()
          ia = 'const AdminFundingDetailPage = lazy(() => import("../features/admin-panel/funding-detail"));\n'
          ins = '''const AdminRevenuesPage = lazy(() => import("../features/admin-panel/revenues"));
          const AdminRevenueDetailPage = lazy(() => import("../features/admin-panel/revenue-detail"));
          '''
          if 'const AdminRevenuesPage =' not in s:
              s = s.replace(ia, ia + ins)
          ea = 'const adminFundingDetailElement = lazyElement(AdminFundingDetailPage);\n'
          ens = '''const adminRevenuesElement = lazyElement(AdminRevenuesPage);
          const adminRevenueDetailElement = lazyElement(AdminRevenueDetailPage);
          '''
          if 'const adminRevenuesElement =' not in s:
              s = s.replace(ea, ea + ens)
          ra = '        <Route path="/panel/admin/funding" element={adminFundingElement} />\n'
          rs = '''        <Route path="/panel/admin/revenues/:revenueId" element={adminRevenueDetailElement} />
                  <Route path="/panel/admin/revenues" element={adminRevenuesElement} />
          '''
          if '<Route path="/panel/admin/revenues"' not in s:
              s = s.replace(ra, ra + rs)
          p.write_text(s)
          PY

      - name: Verify revenue routes and transitions
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'const AdminRevenuesPage = lazy' src/app/router.tsx)" -eq 1
          test "$(grep -c 'const AdminRevenueDetailPage = lazy' src/app/router.tsx)" -eq 1
          grep -Fq 'path="/panel/admin/revenues/:revenueId"' src/app/router.tsx
          grep -Fq 'path="/panel/admin/revenues"' src/app/router.tsx
          grep -Fq 'to="/panel/admin/projects/sample"' src/features/admin-panel/revenue-detail/index.tsx
          ! grep -R -E '2411:(61|64|67|73)' src/features/admin-panel/revenues src/features/admin-panel/revenue-detail

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"
          git diff --exit-code -- package-lock.json

      - name: Commit clean product batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx
          git rm .github/workflows/gate-admin-revenues.yml
          git commit -m "feat(admin-panel): route revenues"
          git push
