name: Verify Admin Panel dashboard

on:
  push:
    branches:
      - feat/admin-panel

permissions:
  contents: write

concurrency:
  group: admin-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "3247324ebdea25561d60aafa22558c5a1dff5468"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/gate-admin-dashboard.yml"
          test "$(git rev-parse HEAD^:src/features/admin-panel/components/AdminSidebar.tsx)" = "b92652b229ed4d99b6828f825e032b8f91bc117e"
          test "$(git rev-parse HEAD^:src/features/admin-panel/index.tsx)" = "2cf39ef60b3dc7f91ca3b7740fd2321806965a6f"
          test "$(git rev-parse HEAD^:src/features/admin-panel/index.css)" = "29f6dddcf83231dde2f748f62e7cc6be923904b4"
          test "$(git rev-parse HEAD^:package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify exact local assets
        run: |
          set -eu
          test "$(git rev-parse HEAD^:public/assets/admin-panel/logo.png)" = "62794b0942c10ee4f4014e4c4b415da11d4e8284"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/kpi-projects.svg)" = "080a2c73d17a1d1e1f0c063c1c5160787281bf5d"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/kpi-startups.svg)" = "7672df87d8e5182df4bcd6e799fa7435b802fa19"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/kpi-funds.svg)" = "5b45cc7ffe8297bd0b6ee38b5c579bdefdbb8b47"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/kpi-beneficiaries.svg)" = "7ce01dca34334737854416326eb811333699128a"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-dashboard.svg)" = "8d6aa68d01cb24f33e436cd65af45796e62e3e58"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-users.svg)" = "7e8cb3e04901cf41ca1fd60d9cc8f149ae97ba52"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-organizations.svg)" = "996a2960c5dcb642ed69a42501cbce5e331feb76"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-projects.svg)" = "e02d667a9381e060d5038373a4d47b50cb2e2542"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-funding.svg)" = "eed8e62340f563b3d3568056b95ce0f8bc3b239f"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-history.svg)" = "8583f72be6946de068d012316cb702eda7896de2"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-settings.svg)" = "02fb12090c95fc3af49d8f8908f3ad3c7e9abc9e"
          test "$(git rev-parse HEAD^:public/assets/admin-panel/nav-logout.svg)" = "fc14eae1f28e3cd8274f880082cd6c3b0048fafa"
          test "$(find public/assets/admin-panel -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 13
          if grep -R -n -E 'figma\.com/api/mcp/asset|static\.codia\.ai|localhost:[0-9]+' src/features/admin-panel public/assets/admin-panel; then
            echo "Remote or temporary asset reference found"
            exit 1
          fi

      - name: Patch admin dashboard route idempotently
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/router.tsx')
          text = path.read_text()
          import_line = 'const AdminPanelDashboardPage = lazy(() => import("../features/admin-panel"));\n'
          element_line = 'const adminPanelDashboardElement = lazyElement(AdminPanelDashboardPage);\n'
          route_line = '        <Route path="/panel/admin" element={adminPanelDashboardElement} />\n'

          if import_line not in text:
              anchor = 'function lazyElement(Page: React.LazyExoticComponent<React.ComponentType>) {'
              assert text.count(anchor) == 1
              text = text.replace(anchor, import_line + '\n' + anchor, 1)

          if element_line not in text:
              anchor = '/**\n * Routes are introduced around the existing Figma-derived screens'
              assert text.count(anchor) == 1
              text = text.replace(anchor, element_line + '\n' + anchor, 1)

          if route_line not in text:
              anchor = '        <Route path="/panel/startup/projects/:projectId/stages/:stageId/report/fund-released" element={startupProjectStageFundReleasedElement} />\n'
              assert text.count(anchor) == 1
              text = text.replace(anchor, route_line + anchor, 1)

          path.write_text(text)
          PY
          test "$(grep -F -c 'const AdminPanelDashboardPage = lazy(() => import("../features/admin-panel"));' src/app/router.tsx)" -eq 1
          test "$(grep -F -c 'const adminPanelDashboardElement = lazyElement(AdminPanelDashboardPage);' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/panel/admin" element={adminPanelDashboardElement} />' src/app/router.tsx)" -eq 1

      - name: Verify dashboard prototype destinations
        run: |
          set -eu
          test "$(grep -F -c 'to="/panel/admin/users"' src/features/admin-panel/index.tsx)" -eq 1
          test "$(grep -F -c 'to="/panel/admin/reports"' src/features/admin-panel/index.tsx)" -eq 1
          test "$(grep -F -c 'to={`/panel/admin/projects/${project.id}`}' src/features/admin-panel/index.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/users"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/organizations"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/projects"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/funding"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/revenues"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/reports"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/content"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          test "$(grep -F -c 'to: "/panel/admin/settings"' src/features/admin-panel/components/AdminSidebar.tsx)" -eq 1
          ! grep -R -n '2411:73' src/features/admin-panel

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --quiet -- package-lock.json

      - name: Commit clean product batch
        run: |
          set -eu
          test "$(git diff --name-only)" = "src/app/router.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gate-admin-dashboard.yml
          git add src/app/router.tsx
          git commit -m "feat(admin-panel): route admin dashboard"
          git push
