name: Backend Phase 3 Final Acceptance

on:
  push:
    branches:
      - feat/backend-phase-3-execution

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moon
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: moon
          RABBITMQ_DEFAULT_PASS: moon-phase2-final-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-local-only
      TEST_RABBITMQ_HOST: localhost
      TEST_RABBITMQ_USER: moon
      TEST_RABBITMQ_PASSWORD: moon-phase2-final-only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/backend-phase-3-execution

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Moon.Platform.slnx

      - name: Build warnings as errors
        run: dotnet build Moon.Platform.slnx -c Release --no-restore -warnaserror

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Verify no pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Moon.Platform.Api/Moon.Platform.Api.csproj
          --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj

      - name: Run full PostgreSQL 18 and RabbitMQ 4 test suite
        run: dotnet test Moon.Platform.slnx -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Phase 3 finalization smoke checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GuardClosedExecution' src/Moon.Platform.Api/Modules/Execution/ExecutionIntegrityInterceptor.cs
          grep -q 'GuardImpactChildren' src/Moon.Platform.Api/Modules/Execution/ExecutionIntegrityInterceptor.cs
          grep -q 'Closeout_seals_execution_and_published_impact_children' tests/Moon.Platform.Tests/Phase3FinalizationTests.cs
          grep -q 'DisabledPaymentGateway' src/Moon.Platform.Api/Program.cs
          test -f docs/releases/phase-3-execution-reporting-slice.md
          test -f docs/releases/phase-3-execution-controls-slice.md
          test -f docs/releases/phase-3-impact-closeout-slice.md

      - name: Verify main remains empty baseline
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "240efa7b2934e189c9647473360c091746cfc647"
          test "$(git rev-parse origin/main^{tree})" = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
