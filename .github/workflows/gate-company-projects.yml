name: Verify Company Panel projects list

on:
  push:
    branches:
      - feat/company-panel

permissions:
  contents: write

jobs:
  verify-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source tree and hashes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="556ac699d090c4d25bcc76efa18ee4ef00a77238"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git rev-parse "$SOURCE^{tree}")" = "669f15d396e93c73633fb77d64edd03bccec9f0e"
          test "$(git rev-parse "$SOURCE:src/features/company-panel/projects/index.tsx")" = "36a89c6973c7830558808d0ae4b2bc1efac9523d"
          test "$(git rev-parse "$SOURCE:src/features/company-panel/projects/index.css")" = "40426819f91d0b878fa96890f639b964ffa02dae"
          test "$(git rev-parse "$SOURCE:src/app/router.tsx")" = "4cc5b03f62ece8f04e0ad7ac8869c8f3b408b16a"
          test "$(git rev-parse "$SOURCE:package-lock.json")" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"
          test "$(git rev-parse "$SOURCE:.github/workflows/verify-frontend-integration.yml")" = "39906066a9546d895c4334a96607648b31593474"

      - name: Verify exact project assets and locality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object public/assets/company-panel/project-family-health.png)" = "483a211cac4dc944c4ba878eedcc631a73430186"
          test "$(git hash-object public/assets/company-panel/project-teen-skills.png)" = "a1ec28aabd2989c8ff16e7354165f35785f8354a"
          test "$(git hash-object public/assets/company-panel/project-rural-women-employment.png)" = "0ec09f679c38d6d0fb49967dd1a492458e5cbdbc"
          test -z "$(grep -R -l -E 'figma\.com/api/mcp/asset|static\.codia\.ai' src/features/company-panel/projects || true)"

      - name: Apply idempotent projects route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/router.tsx')
          s=p.read_text()
          imp='const CompanyProjectsPage = lazy(() => import("../features/company-panel/projects"));\n'
          element='const companyProjectsElement = lazyElement(CompanyProjectsPage);\n'
          route='        <Route path="/panel/company/projects" element={companyProjectsElement} />\n'
          ia='const CompanyPanelDashboardPage = lazy(() => import("../features/company-panel"));\n'
          ea='const companyPanelDashboardElement = lazyElement(CompanyPanelDashboardPage);\n'
          ra='        <Route path="/panel/company" element={companyPanelDashboardElement} />\n'
          assert s.count(imp)==0 and s.count(element)==0 and s.count(route)==0
          assert s.count(ia)==1 and s.count(ea)==1 and s.count(ra)==1
          s=s.replace(ia, ia+imp)
          s=s.replace(ea, ea+element)
          s=s.replace(ra, ra+route)
          p.write_text(s)
          PY
          test "$(grep -F -c 'const CompanyProjectsPage = lazy(() => import("../features/company-panel/projects"));' src/app/router.tsx)" -eq 1
          test "$(grep -F -c 'const companyProjectsElement = lazyElement(CompanyProjectsPage);' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/panel/company/projects" element={companyProjectsElement} />' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/panel/company" element={companyPanelDashboardElement} />' src/app/router.tsx)" -eq 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Commit clean Router integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gate-company-projects.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' '|')" = ".github/workflows/gate-company-projects.yml|src/app/router.tsx|"
          git commit -m "feat(company-panel): route social impact projects"
          git push origin HEAD:feat/company-panel
