name: Verify Projects Page

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/verify-projects.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          remote_refs=$(grep -R 'static.codia.ai' src index.html --exclude-dir=node_modules | wc -l || true)
          asset_count=$(find public/assets/codia -type f | wc -l)
          rtl_count=$(grep -R 'dir="rtl"' src/projects/MahProjects.tsx | wc -l)
          echo "asset_count=$asset_count"
          echo "expected_assets=23"
          echo "remote_codia_refs=$remote_refs"
          echo "rtl_text_nodes=$rtl_count"
          test "$asset_count" -eq 23
          test "$remote_refs" -eq 0
          test "$rtl_count" -gt 100
