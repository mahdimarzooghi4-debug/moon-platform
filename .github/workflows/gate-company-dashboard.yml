name: Verify Company Panel dashboard slice

on:
  push:
    branches:
      - feat/company-panel

permissions:
  contents: write

jobs:
  verify-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source tree and hashes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="9f32e6da82cece0c4c8f719b32754ac38f03320f"
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          test "$(git rev-parse "$SOURCE_HEAD^{tree}")" = "f1ae626868aa5d746bb5171bbb166afcbc314517"
          test "$(git rev-parse "$SOURCE_HEAD:src/features/company-panel/index.tsx")" = "ca6ccd277db58712759c3f365305ba99cd00c828"
          test "$(git rev-parse "$SOURCE_HEAD:src/features/company-panel/index.css")" = "4fa05cbb55cd1db2858e4c344c86907dbdabc720"
          test "$(git rev-parse "$SOURCE_HEAD:src/features/company-panel/components/CompanySidebar.tsx")" = "bbe2f476af803dae9d3b24f8bc2718625090816d"
          test "$(git rev-parse "$SOURCE_HEAD:src/app/router.tsx")" = "7bd4f1eca85b91c26a5deb7fe8fc7e543aad0c1a"
          test "$(git rev-parse "$SOURCE_HEAD:package-lock.json")" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"
          test "$(git rev-parse "$SOURCE_HEAD:.github/workflows/verify-frontend-integration.yml")" = "39906066a9546d895c4334a96607648b31593474"

      - name: Verify exact local Figma assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/assets/company-panel -maxdepth 1 -type f | wc -l)" -eq 12
          test "$(git hash-object public/assets/company-panel/kpi-amount.svg)" = "e9bf822bbe81fcdce6a2d2febf475944b71a9873"
          test "$(git hash-object public/assets/company-panel/kpi-certificate.svg)" = "16f8e4f35d1471cd2f3d8cba76c8adb070aaf89f"
          test "$(git hash-object public/assets/company-panel/kpi-participations.svg)" = "b6ab460f2b7af3ef276f3617017374e042d9bfd9"
          test "$(git hash-object public/assets/company-panel/kpi-projects.svg)" = "ad015625d97e94201648a4bb3e509f815826922b"
          test "$(git hash-object public/assets/company-panel/logo.png)" = "547327d8d11bffa9adaeac7f0115a6b433ea6be1"
          test "$(git hash-object public/assets/company-panel/nav-account.svg)" = "2fe297b826519cdf8b0beb7bdb8c8e67ccab73d7"
          test "$(git hash-object public/assets/company-panel/nav-certificate.svg)" = "a3756d5ed32805919338d63331d626e18b2a3f4e"
          test "$(git hash-object public/assets/company-panel/nav-dashboard.svg)" = "7131f2b76ed6e9a6e2fb3f58c76e9d854914b449"
          test "$(git hash-object public/assets/company-panel/nav-logout.svg)" = "c742a2fa8be4bdae646b4a41328eb93de54880ff"
          test "$(git hash-object public/assets/company-panel/nav-participations.svg)" = "9c5f34857230bffc9104e839bf8f5031a1427ad0"
          test "$(git hash-object public/assets/company-panel/nav-reports.svg)" = "dcb4409de9af0c9246ffa98d19ad7f76a2c9828a"
          test "$(git hash-object public/assets/company-panel/nav-social-projects.svg)" = "361da3fe43071007109127ba9574df626c36ad02"
          test -z "$(grep -R -l -E 'figma\.com/api/mcp/asset|static\.codia\.ai' src/features/company-panel || true)"

      - name: Apply idempotent Company dashboard route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/router.tsx')
          s=p.read_text()
          imp='const CompanyPanelDashboardPage = lazy(() => import("../features/company-panel"));\n'
          element='const companyPanelDashboardElement = lazyElement(CompanyPanelDashboardPage);\n'
          route='        <Route path="/panel/company" element={companyPanelDashboardElement} />\n'
          ia='const StartupSettingsPage = lazy(() => import("../features/startup-panel/settings"));\n'
          ea='const startupSettingsElement = lazyElement(StartupSettingsPage);\n'
          ra='        <Route path="/panel/startup/settings" element={startupSettingsElement} />\n'
          assert s.count(imp)==0 and s.count(element)==0 and s.count(route)==0
          assert s.count(ia)==1 and s.count(ea)==1 and s.count(ra)==1
          s=s.replace(ia, ia+imp)
          s=s.replace(ea, ea+element)
          s=s.replace(ra, ra+route)
          p.write_text(s)
          PY
          test "$(grep -F -c 'const CompanyPanelDashboardPage = lazy(() => import("../features/company-panel"));' src/app/router.tsx)" -eq 1
          test "$(grep -F -c 'const companyPanelDashboardElement = lazyElement(CompanyPanelDashboardPage);' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/panel/company" element={companyPanelDashboardElement} />' src/app/router.tsx)" -eq 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Commit clean Router integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gate-company-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' '|')" = ".github/workflows/gate-company-dashboard.yml|src/app/router.tsx|"
          git commit -m "feat(company-panel): route company dashboard"
          git push origin HEAD:feat/company-panel
