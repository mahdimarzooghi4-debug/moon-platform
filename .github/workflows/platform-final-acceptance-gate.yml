name: Platform Final Acceptance Gate

on:
  push:
    branches:
      - integration/platform-final-acceptance

permissions:
  contents: read

concurrency:
  group: platform-final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moon
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: moon
          RABBITMQ_DEFAULT_PASS: moon-phase2-final-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-local-only
      TEST_RABBITMQ_HOST: localhost
      TEST_RABBITMQ_USER: moon
      TEST_RABBITMQ_PASSWORD: moon-phase2-final-only
      VITE_OIDC_AUTHORITY: https://identity.example.invalid/realms/moon
      VITE_OIDC_CLIENT_ID: moon-web
      VITE_API_BASE_URL: http://localhost:5080

    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/platform-final-acceptance

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Frontend reproducible build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Backend restore and warnings-as-errors build
        working-directory: backend
        run: |
          dotnet restore Moon.Platform.slnx
          dotnet build Moon.Platform.slnx -c Release --no-restore -warnaserror

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Verify no pending EF model changes
        working-directory: backend
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Moon.Platform.Api/Moon.Platform.Api.csproj
          --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj

      - name: Full backend suite with PostgreSQL 18 and RabbitMQ 4
        working-directory: backend
        run: dotnet test Moon.Platform.slnx -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Verify delivery architecture files
        shell: bash
        run: |
          set -euo pipefail
          test -f .gitlab-ci.yml
          test -f Dockerfile
          test -f backend/Dockerfile
          test -f deploy/nginx.conf
          test ! -f .github/workflows/verify-frontend-integration.yml
          grep -q 'CI_REGISTRY_IMAGE/backend' .gitlab-ci.yml
          grep -q 'CI_REGISTRY_IMAGE/frontend' .gitlab-ci.yml
          grep -q 'DisabledPaymentGateway' backend/src/Moon.Platform.Api/Program.cs

      - name: Build frontend production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain --pull \
            --build-arg VITE_OIDC_AUTHORITY="$VITE_OIDC_AUTHORITY" \
            --build-arg VITE_OIDC_CLIENT_ID="$VITE_OIDC_CLIENT_ID" \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            -t moon-frontend:acceptance .

      - name: Build backend production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain --pull -f backend/Dockerfile -t moon-backend:acceptance backend

      - name: Verify containers run unprivileged and serve health endpoints
        shell: bash
        run: |
          set -euo pipefail
          frontend_user="$(docker inspect -f '{{.Config.User}}' moon-frontend:acceptance)"
          backend_user="$(docker inspect -f '{{.Config.User}}' moon-backend:acceptance)"
          test -n "$frontend_user" && test "$frontend_user" != "0" && test "$frontend_user" != "root"
          test -n "$backend_user" && test "$backend_user" != "0" && test "$backend_user" != "root"

          docker run -d --name moon-frontend-acceptance -p 18080:8080 moon-frontend:acceptance
          docker run -d --name moon-backend-acceptance -p 18081:8080 moon-backend:acceptance
          trap 'docker rm -f moon-frontend-acceptance moon-backend-acceptance >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/health/live && break || sleep 1; done
          curl -fsS http://127.0.0.1:18081/health/live
          curl -fsS http://127.0.0.1:18081/api/v1/system

      - name: Verify main remains exact empty baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "240efa7b2934e189c9647473360c091746cfc647"
          test "$(git rev-parse origin/main^{tree})" = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
