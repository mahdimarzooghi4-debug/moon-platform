name: Verify frontend integration

on:
  push:
    branches:
      - integration/frontend-foundation
      - integration/landing-frontend
      - feat/startup-panel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify startup panel route
        run: |
          grep -Fq 'const StartupPanelDashboardPage = lazy(() => import("../features/startup-panel"));' src/app/router.tsx
          grep -Fq '<Route path="/panel/startup" element={startupPanelDashboardElement} />' src/app/router.tsx

      - name: Verify local Figma assets
        run: |
          test -f public/assets/startup-panel/logo.png
          test -f public/assets/startup-panel/nav-dashboard.svg
          test -f public/assets/startup-panel/kpi-account.svg
          if grep -R "figma.com/api/mcp/asset" src/features/startup-panel public/assets/startup-panel; then
            echo "Expiring Figma asset URL detected"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json
