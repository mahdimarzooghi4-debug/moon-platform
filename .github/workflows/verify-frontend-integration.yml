name: Integrate Company Register Step 2

on:
  push:
    branches:
      - integration/landing-frontend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/landing-frontend
          fetch-depth: 0

      - name: Migrate pinned company register step 2
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="e7db46c510aceabad420bb4a68d3cce96bc7bc61"
          TARGET="src/features/company-registration/states/step2"
          EXPECTED_TSX="e7746416ad6553df8bc5eb0d5ae62b71f2b75c48"
          EXPECTED_CSS="c186ff82f55d46cfbba38f3d86bfc11e0ca4fddd"
          ASSETS=(
            "public/assets/codia/1vnQP4yM8Y.svg"
            "public/assets/codia/86mTM8H5kj.png"
            "public/assets/codia/8zvRJPY3ny.svg"
            "public/assets/codia/FeXdCWbzFg.svg"
            "public/assets/codia/KwbFeoYbY3.svg"
            "public/assets/codia/pm1yOagzks.svg"
          )
          EXPECTED_ASSET_SHAS=(
            "6899d238d5ef40ed15ca6bb2815207e0c2b32032"
            "b41d325f6fedd470de49aa75b4768cced118781e"
            "6899d238d5ef40ed15ca6bb2815207e0c2b32032"
            "33ca1fea4c9355d887b97f8378b6ea98cbd0c0d6"
            "7f36a71ad3b1fb694d55437007fac48dd0e78815"
            "6899d238d5ef40ed15ca6bb2815207e0c2b32032"
          )

          git fetch origin "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA:src/page/index.tsx")" = "$EXPECTED_TSX"
          test "$(git rev-parse "$SOURCE_SHA:src/page/index.css")" = "$EXPECTED_CSS"
          test ! -e "$TARGET"
          if git show "$SOURCE_SHA:src/page/index.tsx" | grep -Fq "static.codia.ai"; then
            echo "remote Codia dependency detected"
            exit 1
          fi

          mapfile -t SOURCE_ASSETS < <(git ls-tree -r --name-only "$SOURCE_SHA" public/assets/codia | sort)
          mapfile -t EXPECTED_ASSETS < <(printf '%s\n' "${ASSETS[@]}" | sort)
          test "${#SOURCE_ASSETS[@]}" -eq 6
          diff -u <(printf '%s\n' "${EXPECTED_ASSETS[@]}") <(printf '%s\n' "${SOURCE_ASSETS[@]}")

          mkdir -p "$TARGET"
          git show "$SOURCE_SHA:src/page/index.tsx" > "$TARGET/index.tsx"
          git show "$SOURCE_SHA:src/page/index.css" > "$TARGET/index.css"
          test "$(git hash-object "$TARGET/index.tsx")" = "$EXPECTED_TSX"
          test "$(git hash-object "$TARGET/index.css")" = "$EXPECTED_CSS"

          for i in "${!ASSETS[@]}"; do
            asset="${ASSETS[$i]}"
            expected="${EXPECTED_ASSET_SHAS[$i]}"
            source_blob="$(git rev-parse "$SOURCE_SHA:$asset")"
            test "$source_blob" = "$expected"
            if git cat-file -e "HEAD:$asset" 2>/dev/null; then
              test "$(git rev-parse "HEAD:$asset")" = "$source_blob"
            else
              mkdir -p "$(dirname "$asset")"
              git show "$SOURCE_SHA:$asset" > "$asset"
            fi
            test "$(git hash-object "$asset")" = "$source_blob"
          done

          while IFS= read -r ref; do
            test -f "public${ref}"
          done < <(grep -oE '/assets/codia/[A-Za-z0-9._-]+' "$TARGET/index.tsx" | sort -u)

          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/router.tsx')
          s = p.read_text()
          lazy_anchor = 'const StartupRegistrationStep4Page = lazy(() => import("../features/startup-registration/states/step4"));\n'
          lazy_line = 'const CompanyRegistrationStep2Page = lazy(() => import("../features/company-registration/states/step2"));\n'
          element_anchor = 'const startupRegistrationStep4Element = lazyElement(StartupRegistrationStep4Page);\n'
          element_line = 'const companyRegistrationStep2Element = lazyElement(CompanyRegistrationStep2Page);\n'
          route_anchor = '        <Route path="/register/company" element={<CompanyRegistrationPage />} />\n'
          route_line = '        <Route path="/register/company/states/step2" element={companyRegistrationStep2Element} />\n'
          assert s.count(lazy_anchor) == 1
          assert s.count(element_anchor) == 1
          assert s.count(route_anchor) == 1
          assert lazy_line not in s and element_line not in s and route_line not in s
          s = s.replace(lazy_anchor, lazy_anchor + lazy_line)
          s = s.replace(element_anchor, element_anchor + element_line)
          s = s.replace(route_anchor, route_line + route_anchor)
          assert s.count(lazy_line) == 1
          assert s.count(element_line) == 1
          assert s.count(route_line) == 1
          p.write_text(s)
          PY

          git add "$TARGET" src/app/router.tsx "${ASSETS[@]}"
          test -z "$(git diff --cached --name-only | grep -vE '^(src/features/company-registration/states/step2/|src/app/router.tsx$|public/assets/codia/(1vnQP4yM8Y.svg|86mTM8H5kj.png|8zvRJPY3ny.svg|FeXdCWbzFg.svg|KwbFeoYbY3.svg|pm1yOagzks.svg)$)' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(landing): integrate company registration step 2"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify package-lock reproducibility
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package-lock.json; then
            echo "package-lock.json changed during install"
            git diff -- package-lock.json
            exit 1
          fi

      - name: Push verified integration
        run: git push origin HEAD:integration/landing-frontend