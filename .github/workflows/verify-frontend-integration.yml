name: Verify frontend integration

on:
  push:
    branches:
      - integration/frontend-foundation
      - integration/landing-frontend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge participation tracking failed and empty states
        if: github.ref == 'refs/heads/integration/landing-frontend'
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/participation-track-failed feat/participation-track-empty

          # Refuse to overwrite any existing asset with different content.
          for ref in feat/participation-track-failed feat/participation-track-empty; do
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              if git cat-file -e "$BASE_SHA:$asset" 2>/dev/null; then
                base_blob=$(git rev-parse "$BASE_SHA:$asset")
                incoming_blob=$(git rev-parse "origin/$ref:$asset")
                if [ "$base_blob" != "$incoming_blob" ]; then
                  echo "Asset collision from $ref: $asset"
                  exit 1
                fi
              fi
            done < <(git ls-tree -r --name-only "origin/$ref" -- public/assets/)
          done

          if ! git merge-base --is-ancestor origin/feat/participation-track-failed HEAD; then
            git merge --no-ff -X ours origin/feat/participation-track-failed -m "merge: participation tracking failed state"
          fi
          if ! git merge-base --is-ancestor origin/feat/participation-track-empty HEAD; then
            git merge --no-ff -X ours origin/feat/participation-track-empty -m "merge: participation tracking empty state"
          fi

          # Keep integration infrastructure and Auth exactly as they were at the safe checkpoint.
          git restore --source="$BASE_SHA" --staged --worktree -- .github .gitignore index.html package.json package-lock.json postcss.config.js tailwind.config.js vite.config.js src/App.tsx src/main.tsx src/page

          # Preserve the approved Figma-derived sources under feature namespaces.
          mkdir -p src/participation-track/failed src/participation-track/empty
          git show origin/feat/participation-track-failed:src/page/index.tsx > src/participation-track/failed/index.tsx
          git show origin/feat/participation-track-failed:src/page/index.css > src/participation-track/failed/index.css
          git show origin/feat/participation-track-empty:src/page/index.tsx > src/participation-track/empty/index.tsx
          git show origin/feat/participation-track-empty:src/page/index.css > src/participation-track/empty/index.css

          # Copy only collision-checked assets.
          for ref in feat/participation-track-failed feat/participation-track-empty; do
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              mkdir -p "$(dirname "$asset")"
              git show "origin/$ref:$asset" > "$asset"
            done < <(git ls-tree -r --name-only "origin/$ref" -- public/assets/)
          done

          git add src/participation-track public/assets .github .gitignore index.html package.json package-lock.json postcss.config.js tailwind.config.js vite.config.js src/App.tsx src/main.tsx src/page
          if ! git diff --cached --quiet; then
            git commit -m "feat(landing): integrate participation tracking failed and empty states"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Keep lockfile reproducible
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): sync package lock"

      - name: Push verified integration
        if: github.ref == 'refs/heads/integration/landing-frontend'
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git push origin HEAD:integration/landing-frontend
          else
            echo "No integration commit to push"
          fi
