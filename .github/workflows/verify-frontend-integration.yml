name: Verify frontend integration

on:
  push:
    branches:
      - integration/frontend-foundation
      - integration/landing-frontend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge projects error state
        if: github.ref == 'refs/heads/integration/landing-frontend'
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/projects-list-error

          if ! git merge-base --is-ancestor origin/feat/projects-list-error HEAD; then
            git merge --no-ff -X ours origin/feat/projects-list-error -m "merge: projects list error state"
          fi

          # Keep integration infrastructure and Auth exactly as they were at the safe checkpoint.
          git restore --source="$BASE_SHA" --staged --worktree -- .github .gitignore index.html package.json package-lock.json postcss.config.js tailwind.config.js vite.config.js src/App.tsx src/main.tsx src/page

          # Preserve the approved Figma-derived state inside the existing projects feature.
          mkdir -p src/features/projects/states/error
          git show origin/feat/projects-list-error:src/page/index.tsx > src/features/projects/states/error/index.tsx
          git show origin/feat/projects-list-error:src/page/index.css > src/features/projects/states/error/index.css

          git add src/features/projects/states/error .github .gitignore index.html package.json package-lock.json postcss.config.js tailwind.config.js vite.config.js src/App.tsx src/main.tsx src/page
          if ! git diff --cached --quiet; then
            git commit -m "feat(landing): integrate projects error state"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Keep lockfile reproducible
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): sync package lock"

      - name: Push verified integration
        if: github.ref == 'refs/heads/integration/landing-frontend'
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git push origin HEAD:integration/landing-frontend
          else
            echo "No integration commit to push"
          fi
