name: Integrate Registration Track Rejected

on:
  push:
    branches:
      - integration/landing-frontend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/landing-frontend
          fetch-depth: 0

      - name: Migrate pinned registration rejected state
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="9aa768b644a4ec596452d4230f2d9560c6844670"
          TARGET="src/registration-track/states/rejected"
          EXPECTED_TSX="d981f601b132afb654c0de7a9da2f713961dde5b"
          EXPECTED_CSS="c186ff82f55d46cfbba38f3d86bfc11e0ca4fddd"
          ASSETS=(
            "public/assets/codia/808FogDYer.png"
            "public/assets/codia/jGvoBGuxQh.svg"
            "public/assets/codia/ypmzGpj0vR.svg"
          )

          git fetch origin "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA:src/page/index.tsx")" = "$EXPECTED_TSX"
          test "$(git rev-parse "$SOURCE_SHA:src/page/index.css")" = "$EXPECTED_CSS"
          test ! -e "$TARGET"

          if git show "$SOURCE_SHA:src/page/index.tsx" | grep -Fq "static.codia.ai"; then
            echo "remote Codia dependency detected"
            exit 1
          fi

          mapfile -t SOURCE_ASSETS < <(git ls-tree -r --name-only "$SOURCE_SHA" public/assets/codia | sort)
          mapfile -t EXPECTED_ASSETS < <(printf '%s\n' "${ASSETS[@]}" | sort)
          test "${#SOURCE_ASSETS[@]}" -eq 3
          diff -u <(printf '%s\n' "${EXPECTED_ASSETS[@]}") <(printf '%s\n' "${SOURCE_ASSETS[@]}")

          mkdir -p "$TARGET"
          git show "$SOURCE_SHA:src/page/index.tsx" > "$TARGET/index.tsx"
          git show "$SOURCE_SHA:src/page/index.css" > "$TARGET/index.css"
          test "$(git hash-object "$TARGET/index.tsx")" = "$EXPECTED_TSX"
          test "$(git hash-object "$TARGET/index.css")" = "$EXPECTED_CSS"

          for asset in "${ASSETS[@]}"; do
            source_blob="$(git rev-parse "$SOURCE_SHA:$asset")"
            if git cat-file -e "HEAD:$asset" 2>/dev/null; then
              current_blob="$(git rev-parse "HEAD:$asset")"
              test "$current_blob" = "$source_blob"
            else
              mkdir -p "$(dirname "$asset")"
              git show "$SOURCE_SHA:$asset" > "$asset"
            fi
            test "$(git hash-object "$asset")" = "$source_blob"
          done

          while IFS= read -r ref; do
            test -f "public${ref}"
          done < <(grep -oE '/assets/codia/[A-Za-z0-9._-]+' "$TARGET/index.tsx" | sort -u)

          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/router.tsx')
          s = p.read_text()
          lazy_anchor = 'const RegistrationTrackNeedsEditPage = lazy(() => import("../registration-track/states/needs-edit"));\n'
          lazy_line = 'const RegistrationTrackRejectedPage = lazy(() => import("../registration-track/states/rejected"));\n'
          element_anchor = 'const registrationTrackNeedsEditElement = lazyElement(RegistrationTrackNeedsEditPage);\n'
          element_line = 'const registrationTrackRejectedElement = lazyElement(RegistrationTrackRejectedPage);\n'
          route_anchor = '        <Route path="/registration/track/states/needs-edit" element={registrationTrackNeedsEditElement} />\n'
          route_line = '        <Route path="/registration/track/states/rejected" element={registrationTrackRejectedElement} />\n'
          assert s.count(lazy_anchor) == 1
          assert s.count(element_anchor) == 1
          assert s.count(route_anchor) == 1
          assert lazy_line not in s
          assert element_line not in s
          assert route_line not in s
          s = s.replace(lazy_anchor, lazy_anchor + lazy_line)
          s = s.replace(element_anchor, element_anchor + element_line)
          s = s.replace(route_anchor, route_anchor + route_line)
          assert s.count(lazy_line) == 1
          assert s.count(element_line) == 1
          assert s.count(route_line) == 1
          p.write_text(s)
          PY

          git add "$TARGET" src/app/router.tsx "${ASSETS[@]}"
          test -z "$(git diff --cached --name-only | grep -vE '^(src/registration-track/states/rejected/|src/app/router.tsx$|public/assets/codia/(808FogDYer.png|jGvoBGuxQh.svg|ypmzGpj0vR.svg)$)' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(landing): integrate registration rejected state"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify package-lock reproducibility
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package-lock.json; then
            echo "package-lock.json changed during install"
            git diff -- package-lock.json
            exit 1
          fi

      - name: Push verified integration
        run: git push origin HEAD:integration/landing-frontend