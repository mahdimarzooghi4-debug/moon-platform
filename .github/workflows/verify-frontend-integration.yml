name: Verify frontend integration

on:
  push:
    branches:
      - integration/frontend-foundation
      - integration/landing-frontend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge approved funded participation state
        if: github.ref == 'refs/heads/integration/landing-frontend' && !contains(github.event.head_commit.message, '[landing-merge-bot]')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/participation-checkout-project-funded

          base_sha="$(git rev-parse HEAD)"
          branch="feat/participation-checkout-project-funded"

          if git merge-base --is-ancestor "origin/$branch" HEAD; then
            echo "$branch already integrated"
          else
            git merge --no-ff -X ours "origin/$branch" -m "merge(landing): integrate participation checkout funded state [landing-merge-bot]"
          fi

          # Keep the shared integration shell and Auth page byte-for-byte intact.
          git restore --source="$base_sha" --staged --worktree -- \
            .github \
            .gitignore \
            index.html \
            package.json \
            package-lock.json \
            postcss.config.js \
            tailwind.config.js \
            vite.config.js \
            src/App.tsx \
            src/main.tsx \
            src/page

          mkdir -p src/participation-checkout/funded
          git show origin/feat/participation-checkout-project-funded:src/page/index.tsx > src/participation-checkout/funded/index.tsx
          git show origin/feat/participation-checkout-project-funded:src/page/index.css > src/participation-checkout/funded/index.css

          git add -A src/participation-checkout/funded
          if ! git diff --cached --quiet; then
            git commit -m "chore(landing): isolate funded participation state [landing-merge-bot]"
          fi

          git diff --exit-code "$base_sha" -- \
            .github \
            .gitignore \
            index.html \
            package.json \
            package-lock.json \
            postcss.config.js \
            tailwind.config.js \
            vite.config.js \
            src/App.tsx \
            src/main.tsx \
            src/page

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Keep lockfile reproducible
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(frontend): sync package lock [landing-merge-bot]"
          fi

      - name: Push verified integration
        if: github.ref == 'refs/heads/integration/landing-frontend'
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/integration/landing-frontend)" ]; then
            echo "Nothing to push"
          else
            git push origin HEAD:integration/landing-frontend
          fi
