name: Verify frontend integration

on:
  push:
    branches:
      - integration/frontend-foundation
      - integration/landing-frontend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate rural women project variant
        if: github.ref == 'refs/heads/integration/landing-frontend'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="53208710c4c730b7317929d82a287d43251bd5ca"
          SOURCE_REF="origin/feat/project-rural-women"
          TARGET_DIR="src/features/project-details/variants/rural-women"
          ASSETS=(
            484NJFWM9O.png
            4WmcosAXqg.png
            5ReDQyKQji.png
            6ziZh6g33X.png
            CAcbEHF1K2.png
            PhBELqAvkV.png
            XYbTZLCAeJ.png
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/project-rural-women:refs/remotes/origin/feat/project-rural-women --depth=1

          ACTUAL_SHA=$(git rev-parse "$SOURCE_REF")
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Source branch moved: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi

          while IFS= read -r src_path; do
            rel_path="${src_path#src/page/}"
            dst_path="$TARGET_DIR/$rel_path"
            src_sha=$(git rev-parse "$EXPECTED_SHA:$src_path")
            if [ -e "$dst_path" ]; then
              dst_sha=$(git hash-object "$dst_path")
              if [ "$dst_sha" != "$src_sha" ]; then
                echo "Source collision at $dst_path"
                exit 1
              fi
              continue
            fi
            mkdir -p "$(dirname "$dst_path")"
            git show "$EXPECTED_SHA:$src_path" > "$dst_path"
          done < <(git ls-tree -r --name-only "$EXPECTED_SHA" -- src/page)

          mkdir -p public/assets/codia
          for asset in "${ASSETS[@]}"; do
            asset_path="public/assets/codia/$asset"
            src_sha=$(git rev-parse "$EXPECTED_SHA:$asset_path")
            if [ -e "$asset_path" ]; then
              dst_sha=$(git hash-object "$asset_path")
              if [ "$dst_sha" != "$src_sha" ]; then
                echo "Asset collision at $asset_path"
                exit 1
              fi
              continue
            fi
            git show "$EXPECTED_SHA:$asset_path" > "$asset_path"
          done

          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/router.tsx")
          text = path.read_text()

          import_line = 'const ProjectRuralWomenPage = lazy(() => import("../features/project-details/variants/rural-women"));\n'
          import_anchor = 'const ProjectDetailsPage = lazy(() => import("../features/project-details"));\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Project Details import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          element_line = 'const projectRuralWomenElement = lazyElement(ProjectRuralWomenPage);\n'
          element_anchor = 'const projectDetailsElement = lazyElement(ProjectDetailsPage);\n'
          if element_line not in text:
              if element_anchor not in text:
                  raise SystemExit("Project Details element anchor not found")
              text = text.replace(element_anchor, element_anchor + element_line, 1)

          route_line = '        <Route path="/projects/variants/rural-women" element={projectRuralWomenElement} />\n'
          route_anchor = '        <Route path="/projects/:projectId" element={projectDetailsElement} />\n'
          if route_line not in text:
              if route_anchor not in text:
                  raise SystemExit("Project Details route anchor not found")
              text = text.replace(route_anchor, route_line + route_anchor, 1)

          path.write_text(text)
          PY

          source_count=$(find "$TARGET_DIR" -type f | wc -l)
          remote_refs=$(grep -R 'static.codia.ai' "$TARGET_DIR" --include='*.tsx' --include='*.css' | wc -l || true)
          echo "variant_source_files=$source_count"
          echo "expected_source_files=33"
          echo "remote_codia_refs=$remote_refs"
          test "$source_count" -eq 33
          test "$remote_refs" -eq 0

          git add "$TARGET_DIR" src/app/router.tsx
          for asset in "${ASSETS[@]}"; do
            git add "public/assets/codia/$asset"
          done
          if ! git diff --cached --quiet; then
            git commit -m "feat(landing): integrate rural women project variant"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Keep lockfile reproducible
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): sync package lock"

      - name: Push verified integration
        if: github.ref == 'refs/heads/integration/landing-frontend'
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git push origin HEAD:integration/landing-frontend
          else
            echo "No integration commit to push"
          fi
