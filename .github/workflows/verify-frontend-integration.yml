name: Verify frontend integration

on:
  push:
    branches:
      - feat/startup-panel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source and hashes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="e8dbd78f0cf70840e7fd094ff4f92805eda2b70f"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "91cd2e4ff2051f1b8e3acca71335a683ddddbf8a"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/reports/index.tsx")" = "6b7885272227c75774931197180fbd186561f3ce"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/reports/index.css")" = "4b64bd81bd21b5d5f50015c1a6402d15b86f05fd"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/report-detail/index.tsx")" = "78fd94775bc3db810f6c25d9455f1446b2376f5f"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/report-detail/index.css")" = "0d25bdb91f5b990d7b5dec40ee2f04d3001054bd"
          test "$(git rev-parse "$SOURCE_SHA:src/app/router.tsx")" = "7d7e555b4cb2738a78174e956ee4a2a1096e832c"
          test "$(git rev-parse "$SOURCE_SHA:package-lock.json")" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify asset isolation
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'static\.codia\.ai|figma\.com/api/mcp/asset' \
            src/features/startup-panel/reports \
            src/features/startup-panel/report-detail; then
            echo "Remote generated asset reference found"
            exit 1
          fi

      - name: Verify reports routes and transitions
        shell: bash
        run: |
          set -euo pipefail
          ROUTER=src/app/router.tsx
          SIDEBAR=src/features/startup-panel/components/StartupSidebar.tsx
          LIST=src/features/startup-panel/reports/index.tsx
          DETAIL=src/features/startup-panel/report-detail/index.tsx
          test "$(grep -Fxc 'const StartupReportsPage = lazy(() => import("../features/startup-panel/reports"));' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const StartupReportDetailPage = lazy(() => import("../features/startup-panel/report-detail"));' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const startupReportsElement = lazyElement(StartupReportsPage);' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const startupReportDetailElement = lazyElement(StartupReportDetailPage);' "$ROUTER")" -eq 1
          test "$(grep -Fxc '        <Route path="/panel/startup/reports/:reportId" element={startupReportDetailElement} />' "$ROUTER")" -eq 1
          test "$(grep -Fxc '        <Route path="/panel/startup/reports" element={startupReportsElement} />' "$ROUTER")" -eq 1
          test "$(grep -Fc '{ key: "reports", label: "گزارش‌ها و مستندات", to: "/panel/startup/reports", icon: "nav-reports.svg" },' "$SIDEBAR")" -eq 1
          test "$(grep -Fc 'to="/panel/startup/reports/MAH-R-1405-0018"' "$LIST")" -eq 1
          test "$(grep -Fc 'to="/panel/startup/reports"' "$DETAIL")" -eq 1
          test "$(grep -Fc 'onClick={() => setFilter(item.key)}' "$LIST")" -eq 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json
