name: Verify frontend integration

on:
  push:
    branches:
      - integration/frontend-foundation
      - integration/landing-frontend
      - feat/startup-panel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "43c175029b3e504271c9c7a2af9daee52c14c584"
          test "$(git hash-object src/features/startup-panel/project-stage-detail/index.tsx)" = "1f09b21075b86866691f0ad97515220b0ac2ee5d"
          test "$(git hash-object src/features/startup-panel/project-stage-detail/index.css)" = "0fd93f16d26a9d65bd415ac117a029e78ebcce78"
          test "$(git hash-object src/app/router.tsx)" = "b800b5e444e244fb3d5c83fc3110ba7d500a4522"
          test "$(git hash-object package-lock.json)" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify asset isolation
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'figma\.com/api/mcp/asset|static\.codia\.ai' src/features/startup-panel/project-stage-detail; then
            echo "Temporary remote asset URL found in stage detail implementation"
            exit 1
          fi

      - name: Verify stage detail routes
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -F -c 'const StartupProjectStageDetailPage = lazy(() => import("../features/startup-panel/project-stage-detail"));' src/app/router.tsx)" -eq 1
          test "$(grep -F -c 'const startupProjectStageDetailElement = lazyElement(StartupProjectStageDetailPage);' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/panel/startup/projects/:projectId/stages/:stageId/in-progress" element={startupProjectStageDetailElement} />' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/panel/startup/projects/:projectId/stages/:stageId" element={startupProjectStageDetailElement} />' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/panel/startup/projects/:projectId/stages" element={startupProjectStagesElement} />' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/projects" element={projectsElement} />' src/app/router.tsx)" -eq 1
          test "$(grep -F -c '<Route path="/projects/:projectId" element={projectDetailsElement} />' src/app/router.tsx)" -eq 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json
