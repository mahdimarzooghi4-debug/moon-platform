name: Verify frontend integration

on:
  push:
    branches:
      - feat/startup-panel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify pinned source and hashes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="2fd951150941f899b92b60681d92dcc711c89911"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "d491ecfa5f1a4b4d605f24d5c4cdd42a3f0fdca4"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile/index.tsx")" = "488fb71311810b7cf34835937d6847e82f045ba1"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile/index.css")" = "dd8fec58955bea49e7fe998af077b2432f74a247"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile-edit-basic/index.tsx")" = "527617aa827ca1a0817e52e7f6037a5231b74c2c"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile-edit-basic/index.css")" = "2c4ef26d7fccb4a2e2f35d17810366349348f542"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile-edit-product-team/index.tsx")" = "38ac23c1c92567bc2e06ad6d4b8ec172ca7e26e5"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile-edit-product-team/index.css")" = "b4e5ea26a0bb99cf8259019098e27f8f77f0de25"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile-edit-impact-documents/index.tsx")" = "5733c38a3db45007165d1167d52aac81e4eff932"
          test "$(git rev-parse "$SOURCE_SHA:src/features/startup-panel/profile-edit-impact-documents/index.css")" = "21bc7ffd0864b93ae9749d4407f06da9ded21439"
          test "$(git rev-parse "$SOURCE_SHA:src/app/router.tsx")" = "3ded6dc91af91d77efac18eefd5049a1152deeb4"
          test "$(git rev-parse "$SOURCE_SHA:package-lock.json")" = "44cbe24f2addd9f712ad76f88b7ff8432b877818"

      - name: Verify asset isolation
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'static\.codia\.ai|figma\.com/api/mcp/asset' \
            src/features/startup-panel/profile \
            src/features/startup-panel/profile-edit-basic \
            src/features/startup-panel/profile-edit-product-team \
            src/features/startup-panel/profile-edit-impact-documents; then
            echo "Remote generated asset reference found"
            exit 1
          fi

      - name: Verify profile routes and transitions
        shell: bash
        run: |
          set -euo pipefail
          ROUTER=src/app/router.tsx
          PROFILE=src/features/startup-panel/profile/index.tsx
          BASIC=src/features/startup-panel/profile-edit-basic/index.tsx
          PRODUCT=src/features/startup-panel/profile-edit-product-team/index.tsx
          IMPACT=src/features/startup-panel/profile-edit-impact-documents/index.tsx
          test "$(grep -Fxc 'const StartupProfilePage = lazy(() => import("../features/startup-panel/profile"));' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const StartupProfileEditBasicPage = lazy(() => import("../features/startup-panel/profile-edit-basic"));' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const StartupProfileEditProductTeamPage = lazy(() => import("../features/startup-panel/profile-edit-product-team"));' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const StartupProfileEditImpactDocumentsPage = lazy(() => import("../features/startup-panel/profile-edit-impact-documents"));' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const startupProfileElement = lazyElement(StartupProfilePage);' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const startupProfileEditBasicElement = lazyElement(StartupProfileEditBasicPage);' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const startupProfileEditProductTeamElement = lazyElement(StartupProfileEditProductTeamPage);' "$ROUTER")" -eq 1
          test "$(grep -Fxc 'const startupProfileEditImpactDocumentsElement = lazyElement(StartupProfileEditImpactDocumentsPage);' "$ROUTER")" -eq 1
          test "$(grep -Fxc '        <Route path="/panel/startup/profile/edit/impact-documents" element={startupProfileEditImpactDocumentsElement} />' "$ROUTER")" -eq 1
          test "$(grep -Fxc '        <Route path="/panel/startup/profile/edit/product-team" element={startupProfileEditProductTeamElement} />' "$ROUTER")" -eq 1
          test "$(grep -Fxc '        <Route path="/panel/startup/profile/edit" element={startupProfileEditBasicElement} />' "$ROUTER")" -eq 1
          test "$(grep -Fxc '        <Route path="/panel/startup/profile" element={startupProfileElement} />' "$ROUTER")" -eq 1
          test "$(grep -Fc 'to="/panel/startup/profile/edit"' "$PROFILE")" -eq 1
          test "$(grep -Fc 'to="/panel/startup/profile/edit/product-team"' "$BASIC")" -eq 1
          test "$(grep -Fc 'to="/panel/startup/profile/edit/impact-documents"' "$BASIC")" -eq 1
          test "$(grep -Fc 'to="/panel/startup/profile/edit/impact-documents"' "$PRODUCT")" -ge 1
          test "$(grep -Fc 'to="/panel/startup/profile/edit"' "$IMPACT")" -eq 1
          test "$(grep -Fc 'to="/panel/startup/profile/edit/product-team"' "$IMPACT")" -eq 1
          ! grep -R -n -E '2409:441|2409:444' src/features/startup-panel/profile* || false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json
