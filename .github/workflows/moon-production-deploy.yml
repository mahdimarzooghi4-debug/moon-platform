name: Moon Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moon-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy reviewed code from main. A manual run from another branch is rejected.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate production Compose
        run: docker compose --env-file deploy/production/env.example -f deploy/production/compose.yaml config --quiet
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.MOON_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MOON_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "Missing MOON_DEPLOY_SSH_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing MOON_DEPLOY_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/moon_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/moon_deploy" "$HOME/.ssh/known_hosts"
      - name: Compare API with the running release
        id: api_release
        env:
          DEPLOY_HOST: ${{ secrets.MOON_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MOON_DEPLOY_USER }}
        run: |
          set -euo pipefail
          image=$(ssh -i "$HOME/.ssh/moon_deploy" -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect --format '{{.State.Running}} {{.Config.Image}}' moon-platform-api-1 2>/dev/null || true")
          api_tag="$GITHUB_SHA"
          update=true
          if [[ "$image" =~ ^true[[:blank:]]moon-platform/api:([a-f0-9]{40})$ ]]; then
            running_tag="${BASH_REMATCH[1]}"
            if git fetch --depth=1 origin "$running_tag" &&
              git diff --quiet "$running_tag" "$GITHUB_SHA" -- backend deploy/production; then
              api_tag="$running_tag"
              update=false
            fi
          fi
          printf 'tag=%s\nupdate=%s\n' "$api_tag" "$update" >> "$GITHUB_OUTPUT"
      - name: Build API image
        if: steps.api_release.outputs.update == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build --tag "moon-platform/api:$IMAGE_TAG" --file backend/Dockerfile backend
      - name: Transfer API image
        if: steps.api_release.outputs.update == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.MOON_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MOON_DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/moon-api-$IMAGE_TAG.tar.gz"
          remote_archive="/opt/moon/.moon-api-$IMAGE_TAG.tar.gz"
          docker save "moon-platform/api:$IMAGE_TAG" | gzip -1 > "$archive"
          du -h "$archive"
          ssh_args=(-i "$HOME/.ssh/moon_deploy" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=4)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${ssh_args[@]}" "$target" 'command -v rsync >/dev/null'
          rsync --partial --info=progress2 --outbuf=L --timeout=180 \
            -e "ssh -i $HOME/.ssh/moon_deploy -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=4" \
            "$archive" "$target:$remote_archive"
          echo "Transfer complete; loading image on server"
          ssh "${ssh_args[@]}" "$target" "docker load -i '$remote_archive' && rm -f -- '$remote_archive'"
      - name: Build and deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.MOON_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MOON_DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
          API_TAG: ${{ steps.api_release.outputs.tag }}
          UPDATE_API: ${{ steps.api_release.outputs.update }}
          MOON_SMS_DEPLOY_KEY: ${{ secrets.MOON_SMS_IR_API_KEY }}
          MOON_SMS_DEPLOY_TEMPLATE: ${{ vars.MOON_SMS_IR_STARTUP_TEMPLATE_ID || '743974' }}
          MOON_SMS_DEPLOY_PARAMETER: ${{ vars.MOON_SMS_IR_STARTUP_CODE_PARAMETER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing MOON_DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing MOON_DEPLOY_USER"; exit 1; }
          if [ -n "$MOON_SMS_DEPLOY_KEY" ] && ! [[ "$MOON_SMS_DEPLOY_TEMPLATE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Set the MOON_SMS_IR_STARTUP_TEMPLATE_ID repository variable before enabling SMS.ir"
            exit 1
          fi
          {
            if [ -n "$MOON_SMS_DEPLOY_KEY" ]; then
              printf 'export MOON_SMS_PROVIDER=SmsIr MOON_SMS_IR_API_KEY=%q MOON_SMS_IR_STARTUP_TEMPLATE_ID=%q MOON_SMS_IR_STARTUP_CODE_PARAMETER=%q\n' \
                "$MOON_SMS_DEPLOY_KEY" "$MOON_SMS_DEPLOY_TEMPLATE" "${MOON_SMS_DEPLOY_PARAMETER:-Code}"
            fi
            cat <<'REMOTE'
          set -euo pipefail
          cd /opt/moon/app
          test -f deploy/production/.env.production
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$IMAGE_TAG"
          git switch -C moon-production FETCH_HEAD
          if [ "$UPDATE_API" = false ]; then
            test "$(docker inspect --format '{{.State.Running}} {{.Config.Image}}' moon-platform-api-1)" = "true moon-platform/api:$MOON_API_IMAGE_TAG"
          fi
          export MOON_IMAGE_TAG="$IMAGE_TAG"

          bash deploy/production/preflight.sh

          docker build \
            --build-arg VITE_OIDC_AUTHORITY=https://mahcsr.ir/identity/realms/moon \
            --build-arg VITE_OIDC_CLIENT_ID=moon-web \
            --build-arg VITE_API_BASE_URL=https://mahcsr.ir \
            --build-arg NODE_OPTIONS=--max-old-space-size=5120 \
            --tag "moon-platform/web:$IMAGE_TAG" .
          if [ "$UPDATE_API" = true ]; then
            docker compose --profile migrations --env-file deploy/production/.env.production -f deploy/production/compose.yaml run --rm migrate
            docker compose --env-file deploy/production/.env.production -f deploy/production/compose.yaml up -d --remove-orphans
          else
            docker compose --env-file deploy/production/.env.production -f deploy/production/compose.yaml up -d --no-deps --no-build --pull never api web
          fi
          env_file=deploy/production/.env.production
          sed -i -e '/^MOON_IMAGE_TAG=/d' -e '/^MOON_API_IMAGE_TAG=/d' "$env_file"
          printf '\nMOON_IMAGE_TAG=%s\nMOON_API_IMAGE_TAG=%s\n' "$IMAGE_TAG" "$MOON_API_IMAGE_TAG" >> "$env_file"
          docker compose --env-file deploy/production/.env.production -f deploy/production/compose.yaml ps
          REMOTE
          } | ssh -i "$HOME/.ssh/moon_deploy" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "IMAGE_TAG='$IMAGE_TAG' MOON_API_IMAGE_TAG='$API_TAG' UPDATE_API='$UPDATE_API' bash -s"
