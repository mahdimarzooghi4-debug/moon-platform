name: Backend Phase 2 Outbox Threshold Gate

on:
  push:
    branches:
      - feat/backend-phase-2-funding

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moon
          POSTGRES_USER: moon
          POSTGRES_PASSWORD: moon-phase2-outbox-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moon -d moon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: moon
          RABBITMQ_DEFAULT_PASS: moon-phase2-final-only
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit default_queue_type quorum"
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Moon.Platform.slnx

      - name: Build with warnings as errors
        run: dotnet build Moon.Platform.slnx --no-restore --configuration Release -warnaserror

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Generate Phase 2 outbox threshold migration when absent
        id: migration
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-phase2-outbox-only
        run: |
          set -euo pipefail
          if grep -R -Fq 'partial class Phase2OutboxThreshold' src/Moon.Platform.Api/Infrastructure/Persistence/Migrations; then
            echo 'generated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dotnet ef migrations add Phase2OutboxThreshold \
            --project src/Moon.Platform.Api/Moon.Platform.Api.csproj \
            --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj
          echo 'generated=true' >> "$GITHUB_OUTPUT"

      - name: Commit generated migration
        if: steps.migration.outputs.generated == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Moon.Platform.Api/Infrastructure/Persistence/Migrations
          git commit -m 'chore(funding): add generated outbox threshold migration'
          git push origin HEAD:feat/backend-phase-2-funding

      - name: Stop after migration commit
        if: steps.migration.outputs.generated == 'true'
        run: echo 'Migration committed; a follow-up push will execute the full gate.'

      - name: Verify committed migrations match model
        if: steps.migration.outputs.generated != 'true'
        run: dotnet ef migrations has-pending-model-changes --project src/Moon.Platform.Api/Moon.Platform.Api.csproj --startup-project src/Moon.Platform.Api/Moon.Platform.Api.csproj

      - name: Test full backend against PostgreSQL 18 and RabbitMQ 4
        if: steps.migration.outputs.generated != 'true'
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Database=moon;Username=moon;Password=moon-phase2-outbox-only
          TEST_RABBITMQ_HOST: localhost
          TEST_RABBITMQ_USER: moon
          TEST_RABBITMQ_PASSWORD: moon-phase2-final-only
        run: dotnet test Moon.Platform.slnx --no-build --configuration Release

      - name: Validate local infrastructure compose
        if: steps.migration.outputs.generated != 'true'
        run: docker compose config >/tmp/moon-compose.yml

      - name: Outbox and threshold smoke checks
        if: steps.migration.outputs.generated != 'true'
        run: |
          set -euo pipefail
          test -f src/Moon.Platform.Api/Common/Messaging/OutboxModels.cs
          test -f src/Moon.Platform.Api/Common/Messaging/OutboxWriter.cs
          test -f src/Moon.Platform.Api/Common/Messaging/OutboxDispatcher.cs
          test -f tests/Moon.Platform.Tests/Phase2OutboxThresholdTests.cs
          test -f tests/Moon.Platform.Tests/Phase2OutboxDispatcherTests.cs
          grep -Fq 'FundingThresholdReached' src/Moon.Platform.Api/Common/Messaging/OutboxModels.cs
          grep -Fq 'FundingTargetMinor' src/Moon.Platform.Api/Modules/Projects/ProjectModels.cs
          grep -Fq 'funding-threshold-reached:' src/Moon.Platform.Api/Modules/Funding/LedgerService.cs
          grep -Fq 'FOR UPDATE SKIP LOCKED' src/Moon.Platform.Api/Common/Messaging/OutboxDispatcher.cs
          grep -Fq 'default_queue_type quorum' docker-compose.yml
          grep -Fq 'OutboxDispatchEnabled' src/Moon.Platform.Api/appsettings.json
          grep -Fq 'Funding_threshold_is_emitted_once_only_after_ledger_balance_crosses_locked_project_target' tests/Moon.Platform.Tests/Phase2OutboxThresholdTests.cs
          grep -Fq 'Durable_outbox_dispatches_through_real_RabbitMQ_when_enabled' tests/Moon.Platform.Tests/Phase2OutboxDispatcherTests.cs
