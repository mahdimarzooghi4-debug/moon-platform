# Only negotiate a WebP variant when the client explicitly accepts it.
# Clients with quality parameters on image/webp conservatively use the original.
map $http_accept $moon_webp_suffix {
    default "";
    "~*(^|,)[ \t]*image/webp[ \t]*(,|$)" ".webp";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static build assets only, never API responses.
    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* ^/assets/.+\.(png|jpe?g)$ {
        expires 1d;
        # add_header inheritance is replaced in this location; retain all security headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Vary "Accept" always;
        try_files $uri$moon_webp_suffix $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
