services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moon}
      POSTGRES_USER: ${POSTGRES_USER:-moon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moon-local-only}
    ports:
      - "5432:5432"
    volumes:
      - moon-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moon} -d ${POSTGRES_DB:-moon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-moon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-moon-local-only}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit default_queue_type quorum"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - moon-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/moon-realm.json:/opt/keycloak/data/import/moon-realm.json:ro

volumes:
  moon-postgres:
  moon-rabbitmq:
